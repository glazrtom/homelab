---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: pihole
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
kind: Service
apiVersion: v1
metadata:
  name: pihole-dns-udp-svc
  namespace: {{ .Values.namespace }}
  annotations:
    metallb.universe.tf/allow-shared-ip: "pihole"
    metallb.universe.tf/loadBalancerIPs: "{{ .Values.dns.loadBalancerIP }}"
spec:
  selector:
    app: pihole
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
---
kind: Service
apiVersion: v1
metadata:
  name: pihole-dns-tcp-svc
  namespace: {{ .Values.namespace }}
  annotations:
    metallb.universe.tf/allow-shared-ip: "pihole"
    metallb.universe.tf/loadBalancerIPs: "{{ .Values.dns.loadBalancerIP }}"
spec:
  selector:
    app: pihole
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
