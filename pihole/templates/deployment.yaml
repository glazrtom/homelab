apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
      volumes:
        - name: pihole-config
          persistentVolumeClaim:
            claimName: pihole-config-pvc
      containers:
        - name: pihole
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 80
              name: http
              protocol: TCP
          volumeMounts:
            - name: pihole-config
              mountPath: /etc/pihole
          env:
            - name: TZ
              value: "{{ .Values.global.timezone }}"
            - name: PIHOLE_UID
              value: "{{ .Values.global.user.uid }}"
            - name: PIHOLE_GID
              value: "{{ .Values.global.user.gid }}"
            - name: FTLCONF_dns_upstreams
              value: "{{ .Values.dns.upstreams }}"
            - name: FTLCONF_dns_listeningMode
              value: "all"
            - name: FTLCONF_misc_dnsmasq_lines
              value: "address=/{{ .Values.global.domain.internal.suffix }}/{{ .Values.dns.internalIP }}"
          readinessProbe:
            httpGet:
              path: /admin/login.lp
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /admin/login.lp
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
