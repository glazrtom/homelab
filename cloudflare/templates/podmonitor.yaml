{{- if .Values.global.monitoring.serviceMonitors }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app: cloudflared
  podMetricsEndpoints:
    - port: metrics
      interval: {{ .Values.global.monitoring.interval.slow }}
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "cloudflared_tunnel_(ha_connections|request_errors|total_requests)"
          action: keep
{{- end }}
