apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress
  namespace: argocd
  labels:
    homelab/tier: core
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    path: ingress
    repoURL: https://github.com/glazrtom/homelab.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - ../global/values.yaml
  destination:
    namespace: ingress
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
