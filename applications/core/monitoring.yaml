apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  labels:
    homelab/tier: core
  annotations:
    # Ahead of every other core Application (wave 0+) so prometheus-operator's
    # CRDs exist before longhorn/argocd/ingress/cloudflare render their own
    # ServiceMonitor/PodMonitor
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/glazrtom/homelab.git
    targetRevision: HEAD
    path: monitoring
    helm:
      valueFiles:
        - values.yaml
        - ../global/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus CRD alone exceeds the 262kB last-applied-configuration
      # annotation limit - the sync fails with "metadata.annotations: Too long"
      # without server-side apply.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # prometheus-operator's admission webhooks get their CA bundle patched in at
    # runtime by its own patch Job, same as longhorn's and metallb's.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
