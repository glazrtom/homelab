# --- local values, consumed by our own templates -------------------------
namespace: longhorn-system

app:
  name: longhorn
  domainPrefix: longhorn

service:
  name: longhorn-frontend
  port: 80

# Reachable from the internet, but gated by its own Authentik provider rather than
# the catch-all - only homelab-admins get in. Provider declared in authentik/values.yaml.
ingress:
  enabled: true
  external: true
  auth: true

# Gates the backup-daily/system-backup-weekly RecurringJobs and the BackupTarget CR.
# Target is Backblaze B2 over Longhorn's S3 backupstore; credentialSecret is sealed
# via generate-b2-secret.sh (see ansible/roles/secrets). Scope is the `longhorn`
# StorageClass only (the `protected` RecurringJobSelector group below) - the
# `longhorn-bulk` class and the static shared-media volume are deliberately excluded.
backup:
  enabled: true
  target:
    # s3://<bucket>@<region>/ - the region segment is required syntax, the actual
    # host comes from AWS_ENDPOINTS in the credential secret.
    url: "s3://glazrtom-homelab-longhorn@eu-central-003/"
    credentialSecret: longhorn-b2-credentials
    # A Go time.Duration string - a bare number (e.g. "300") is rejected by the
    # longhorn.io mutating webhook with "missing unit in duration".
    pollInterval: "300s"
  # Reports backup-daily's outcome to Gatus as a push/heartbeat monitor (see
  # gatus/values.yaml external-endpoints and backup-report-cronjob.yaml below) -
  # Gatus alerts if no "success" report ever arrives, so a failure here fails loud
  # instead of silently. schedule is offset from backup-daily's own "0 3 * * *"
  # (recurringjobs.yaml) to give it time to finish; windowHours is the freshness cutoff
  # a Backup CR must fall within to count, matching heartbeat.interval in gatus/values.yaml.
  report:
    enabled: false
    gatusUrl: "http://gatus.gatus:8080"
    tokenSecret: gatus-heartbeat-token
    endpointGroup: backups
    endpointName: longhorn-daily
    recurringJob: backup-daily
    schedule: "30 3 * * *"
    windowHours: 26

# Image shared by the PostSync hook Jobs below (kubectl + bash is all either needs).
hooks:
  image:
    repository: alpine/k8s
    tag: "1.36.5"

# PostSync hook (replica-enforcer-job.yaml) that re-applies
# longhorn.persistence.defaultClassReplicaCount to every volume the `longhorn` class
# already provisioned (identified by the protected RecurringJobSelector group below) on
# every sync of this chart - see the "Replica count is not retroactive" section of the
# longhorn-config skill for why this can't just live on the PVC or StorageClass.
replicaEnforcer:
  enabled: true

# PostSync hook (share-manager-placement-job.yaml) that deletes the shared-media
# share-manager pod when it isn't running on a node matching
# class.bulk.shareManagerNodeSelector, so Longhorn recreates it there - the
# StorageClass parameter only steers where a share-manager pod is *created*, it
# doesn't move an already-running one. See "Pinning the shared-media
# replica/share-manager" in the longhorn-config skill.
shareManagerPlacement:
  enabled: true

class:
  bulk:
    name: longhorn-bulk
    replicaCount: 1
    # Pins the RWX share-manager pod (and, via dataLocality: best-effort on the
    # volume, its replica) to dell - same label as jellyfin/values.yaml's
    # nodeSelector. Format is Longhorn's own "key:value" node-selector syntax,
    # not a YAML map - it's parsed by longhorn-manager's types.UnmarshalNodeSelector
    # from k8s node labels, unrelated to Longhorn's disk/node tags.
    shareManagerNodeSelector: "homelab/gpu:intel"

# --- upstream subchart overrides ------------------------------------------
# Most of these exist only to undo the upstream chart's 3-node assumptions.
longhorn:
  defaultSettings:
    # Replicas per volume when the StorageClass doesn't specify. Upstream: 3. Two nodes
    # can satisfy at most 2 (anti-affinity forbids two replicas on the same node), so
    # this is capped at the node count rather than upstream's 3.
    defaultReplicaCount: 2

    # A node going down otherwise leaves its RWO pods stuck Terminating - the volume
    # can't attach anywhere until the node comes back. With 2 nodes and 2 replicas, the
    # surviving replica lets Longhorn delete-and-reschedule the pod instead.
    nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod

    # Where replica data lives on the host disk. Same as upstream default;
    # stated explicitly because ansible/roles/longhorn_node pre-creates it.
    defaultDataPath: /var/lib/longhorn

    # % of the disk Longhorn refuses to touch, left for the OS/k3s/images.
    # Upstream: 25. Lowered: actual OS+k3s usage is ~7.5GB on a 233GB disk,
    # so 15% (~35GB) is a roomier multiple of current usage without locking
    # away space Longhorn will never use.
    storageReservedPercentageForDefaultDisk: 15

    # Longhorn stops scheduling new replicas once free space drops below
    # this. Upstream default was 25; lowered alongside the reserve above -
    # crossing it only blocks new scheduling, it isn't destructive.
    storageMinimalAvailablePercentage: 15

    # Volumes are thin-provisioned; this caps the SUM of requested sizes
    # against usable space. 100 = no overcommit. Upstream default.
    storageOverProvisioningPercentage: 100

  persistence:
    # Creates the `longhorn` StorageClass AND marks it cluster-default.
    defaultClass: true

    # numberOfReplicas baked into that StorageClass. A class parameter
    # overrides defaultReplicaCount above, so both must be kept in step.
    defaultClassReplicaCount: 2

    # Data survives PVC deletion (including an accidental ArgoCD prune).
    # Upstream default: Delete.
    reclaimPolicy: Retain

    defaultFsType: ext4

    # The selective-backup mechanism: stamps the protected-group label onto
    # every volume this class provisions, so the RecurringJobs below pick
    # them up automatically.
    recurringJobSelector:
      enable: true
      jobList: '[{"name":"protected","isGroup":true}]'

  longhornUI:
    replicas: 1  # upstream default is 2; not worth HA-ing a management UI on 2 nodes

  csi:
    # The four CSI sidecars each default to 3 replicas for HA. 2 nodes still can't
    # satisfy that spread, and a single instance of each is enough at this scale -
    # the extras would just be idle leader-election losers.
    attacherReplicaCount: 1
    provisionerReplicaCount: 1
    resizerReplicaCount: 1
    snapshotterReplicaCount: 1

  preUpgradeChecker:
    # Upstream runs a pre-upgrade validation Job. Jobs are immutable, so
    # ArgoCD selfHeal fights it on every sync.
    jobEnabled: false
