apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.class.bulk.name }}
  annotations:
    # parameters is immutable - a plain ArgoCD sync can't patch it in place, so let
    # ArgoCD delete-and-recreate the SC instead. Bound PVs/PVCs reference the class
    # by name only and are unaffected.
    argocd.argoproj.io/sync-options: Replace=true
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: {{ .Values.class.bulk.replicaCount | quote }}
  staleReplicaTimeout: "30"
  fsType: ext4
  shareManagerNodeSelector: {{ .Values.class.bulk.shareManagerNodeSelector | quote }}
