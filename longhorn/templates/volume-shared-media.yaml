apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: {{ .Values.global.sharedMedia.name }}
  namespace: {{ .Values.namespace }}
spec:
  size: "{{ .Values.global.sharedMedia.sizeBytes }}"
  numberOfReplicas: {{ .Values.class.bulk.replicaCount }}
  accessMode: rwx
  frontend: blockdev
  staleReplicaTimeout: 30
  # Lets Longhorn build a replica on whichever node ends up running the engine/share-manager
  # and drop the one left behind, instead of requiring a manual replica move. Longhorn
  # currently picks the share-manager's node itself - there's no selector to pin it.
  dataLocality: best-effort
