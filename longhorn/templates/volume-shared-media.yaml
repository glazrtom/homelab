apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: {{ .Values.global.sharedMedia.name }}
  namespace: {{ .Values.namespace }}
spec:
  size: "{{ .Values.global.sharedMedia.sizeBytes }}"
  numberOfReplicas: {{ .Values.class.bulk.replicaCount }}
  accessMode: rwx
  frontend: blockdev
  staleReplicaTimeout: 30
  # The share-manager pod is pinned to dell via the longhorn-bulk StorageClass's
  # shareManagerNodeSelector (storageclass-bulk.yaml). best-effort then has Longhorn
  # build this volume's replica on that same node and drop the one left behind,
  # instead of requiring a manual replica move.
  dataLocality: best-effort
