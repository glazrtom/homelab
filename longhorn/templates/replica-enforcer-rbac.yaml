{{- if .Values.replicaEnforcer.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: replica-enforcer
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: replica-enforcer
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: replica-enforcer
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: replica-enforcer
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: replica-enforcer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
