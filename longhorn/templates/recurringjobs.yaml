apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-hourly
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  cron: "0 * * * *"
  task: snapshot
  groups:
    - protected
  retain: 3
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-daily
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  cron: "0 2 * * *"
  task: snapshot
  groups:
    - protected
  retain: 3
  concurrency: 1
{{- if .Values.backup.enabled }}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  cron: "0 3 * * *"
  task: backup
  groups:
    - protected
  retain: 7
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: system-backup-weekly
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  cron: "0 4 * * 0"
  task: system-backup
  retain: 4
  concurrency: 1
  # Records Longhorn's own state (settings, RecurringJobs, volume<->backup mapping)
  # without re-running volume backups the nightly job above already did.
  parameters:
    volume-backup-policy: disabled
{{- end }}
