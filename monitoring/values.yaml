# --- local values, consumed by our own templates -------------------------
namespace: monitoring

# Grafana's own ingress/authOutpost - app.name must match the kube-prometheus-stack
# release name's Grafana Service ("monitoring-grafana", since ArgoCD's implicit
# Helm release name is the Application name) rather than lib.fullname's default.
app:
  name: grafana
  domainPrefix: grafana

service:
  name: monitoring-grafana
  port: 80

# Reachable from the internet, but gated by its own Authentik provider - only
# homelab-admins get in. Provider declared in authentik/values.yaml.
ingress:
  enabled: true
  external: true
  auth: true

priorityClassName: homelab-monitoring

# Soft preference for the worker node (dell, labelled homelab/node-class=worker) - the
# control-plane node (orangepi) already carries k3s + ArgoCD, so give monitoring's own
# footprint somewhere else to land. Soft, not required: monitoring must still run with
# only orangepi up. Reused via YAML anchor by ntfy below and by every kube-prometheus-
# stack component's own affinity key further down.
workerAffinity: &workerAffinity
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: homelab/node-class
              operator: In
              values: ["worker"]

# ntfy: Alertmanager's webhook target. Hand-written Deployment/Service/PVC
# (templates/ntfy.yaml) rather than lib.deployment/lib.service, since those render
# from the chart's single root .Values.app/.Values.image/.Values.volumes, which
# this chart already uses for Grafana's ingress above.
ntfy:
  replicas: 1
  affinity: *workerAffinity
  image:
    repository: binwiederhier/ntfy
    tag: "v2.11.0"
  topic: alerts
  volumes:
    data:
      size: 1Gi
      storageClassName: longhorn
      mountPath: /var/cache/ntfy

# healthchecks.io dead-man switch: one DaemonSet, every node self-registers as its
# own check via slug auto-provisioning (/ping/<key>/<slug>). PING_KEY comes from a
# real healthchecks.io account (see generate-secret.sh) - there is no default/free
# value to generate, so this stays disabled until that key is sealed.
deadManSwitch:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.11.1"
  intervalSeconds: 60

# --- upstream subchart overrides ------------------------------------------
kube-prometheus-stack:
  # The upstream ~150 alert rules and ~30 dashboards are the "clutter" this re-enable
  # is deliberately dropping - our own curated set lives in
  # templates/alert-rules.yaml and templates/dashboards/*.json instead (discovered by
  # the grafana sidecar via the grafana_dashboard: "1" label, already the chart
  # default - see grafana.sidecar.dashboards below).
  defaultRules:
    create: false

  # k3s runs the control plane inside one process with no separately-exposed
  # controller-manager/scheduler/proxy/etcd - without disabling these, the
  # matching KubeControllerManagerDown/KubeSchedulerDown/KubeProxyDown/etcd alerts
  # fire permanently from minute one.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  kubeApiServer:
    serviceMonitor:
      interval: 60s
      # apiserver_request_duration_seconds_bucket alone is a large share of
      # apiserver series on a single-node cluster; drop the buckets, keep the
      # _count/_sum/_total gauges that alerts and dashboards actually use.
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "apiserver_request_duration_seconds_bucket|apiserver_response_sizes_bucket"
          action: drop

  coreDns:
    serviceMonitor:
      interval: 60s

  # Tier A/B intervals below are literals, not references to
  # global.monitoring.interval - a values file can't reference another value.
  # That global is the canonical definition of the two tiers for the charts
  # under applications/core|apps that render their own monitors; keep these in
  # step with it by hand.
  #
  # Tier A - 15s: container/host resource usage spikes between samples in a way
  # that matters mid-incident. cAdvisor ships via the same kubelet endpoint but
  # gets its own relabel list; its histogram buckets are the single largest
  # source of container-level series and are dropped the same way the apiserver's
  # are above.
  kubelet:
    serviceMonitor:
      interval: 15s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "go_.*|grpc_server_handled_total"
          action: drop
      cAdvisorMetricRelabelings:
        - sourceLabels: [__name__]
          regex: "container_.*_bucket"
          action: drop

  kube-state-metrics:
    replicas: 1
    priorityClassName: homelab-monitoring
    affinity: *workerAffinity
    # Only the object kinds §2/§3/§4 of the curated list actually use - default KSM
    # also ships configmaps/secrets/leases/ingresses/etc, which are pure clutter here.
    collectors:
      - nodes
      - pods
      - deployments
      - statefulsets
      - daemonsets
      - jobs
      - persistentvolumeclaims
    prometheus:
      monitor:
        interval: 60s

  nodeExporter:
    enabled: true

  prometheus-node-exporter:
    priorityClassName: homelab-monitoring
    # Tier A - 15s. hwmon/thermal_zone/cpufreq cover the rockchip SoC's thermal
    # throttling; the base collector set already includes cpu/meminfo/diskstats/
    # netdev/filesystem/pressure (PSI).
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
      - --collector.hwmon
      - --collector.thermal_zone
      - --collector.cpufreq
      # PSI needs a 4.20+ kernel with CONFIG_PSI - on by default on both nodes' kernels;
      # harmless no-op metric absence if a future kernel lacks it.
      - --collector.pressure
    prometheus:
      monitor:
        interval: 15s
        # Default ServiceMonitor SD leaves `instance` as the scrape target's
        # address (node-exporter runs hostNetwork, so that's the node's bare
        # IP) - every node/CPU/disk panel in nodes.json legends by {{instance}},
        # so relabel it to the actual node name instead.
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: instance
        # Go runtime metrics from the exporter's own process, plus scrape-meta series -
        # noise on every target, node-exporter included.
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: "go_.*|process_.*|node_scrape_collector_.*"
            action: drop

  # Self-signed cert + patch Job (default, no cert-manager in this cluster) - the
  # Job patches the webhook's caBundle at install/upgrade time, same reason
  # longhorn/metallb's webhooks need an ignoreDifferences entry on the ArgoCD
  # Application (applications/core/monitoring.yaml).
  prometheusOperator:
    priorityClassName: homelab-monitoring
    affinity: *workerAffinity

  grafana:
    replicas: 1
    priorityClassName: homelab-monitoring
    affinity: *workerAffinity
    # The upstream dashboard set (~30 dashboards covering CoreDNS internals,
    # etcd, per-resource apiserver breakdowns, ...) - replaced by
    # templates/dashboards/*.json, picked up by the sidecar below via the
    # grafana_dashboard: "1" ConfigMap label (chart default, ALL namespaces).
    defaultDashboardsEnabled: false
    # Ingress is rendered by this chart's own templates/ingress.yaml (lib.ingress),
    # gated by Authentik - not the subchart's own ingress (which knows nothing
    # about the two IngressClasses or forward-auth).
    ingress:
      enabled: false
    admin:
      existingSecret: monitoring-grafana-admin
      # Uppercase-with-underscore because generate-secret.sh's resolve() uses the
      # Secret key as a bash variable name (rallly/generate-secret.sh does the
      # same for POSTGRES_USER etc.) - hyphens aren't legal there.
      userKey: ADMIN_USER
      passwordKey: ADMIN_PASSWORD
    # Grafana never gets its own SSO login: the outpost's forward-auth already
    # gates this Ingress, and auth.proxy trusts the X-authentik-username header
    # it sets - one login, no second credential prompt.
    grafana.ini:
      server:
        root_url: "https://%(domain)s/"
      auth.proxy:
        enabled: true
        header_name: X-authentik-username
        header_property: username
        auto_sign_up: true

  alertmanager:
    alertmanagerSpec:
      replicas: 1
      priorityClassName: homelab-monitoring
      affinity: *workerAffinity
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 10m, memory: 32Mi }
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: ntfy
        group_by: ["alertname", "namespace"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          # The always-firing Watchdog alert never reaches ntfy - it exists so an
          # external dead-man switch (healthchecks.io) can watch the alerting
          # pipeline itself: no ping means Prometheus or Alertmanager is down.
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: "null"
        - name: ntfy
          webhook_configs:
            - url: http://ntfy.monitoring:80/alerts/publish
              send_resolved: true

  prometheus:
    prometheusSpec:
      # Monitors for third-party targets (longhorn, argocd, gatus, ingress-nginx,
      # cloudflared) live in the charts they monitor, not here - see each chart's
      # templates/servicemonitor.yaml or podmonitor.yaml, gated on
      # global.monitoring.serviceMonitors. They can't carry this release's name
      # as a label, so nil selectors here mean "match every
      # ServiceMonitor/PodMonitor in every namespace" instead of the Helm default
      # of "only ones labelled release: <this release>".
      #
      # Deferred: MetalLB's frr-metrics (metallb-system, port frrmetricshttps/9141)
      # is mTLS-protected by kube-rbac-proxy in this chart version - scraping it
      # needs a client cert this chart doesn't yet provision. Revisit once that's
      # worked out rather than shipping a target that silently never comes up.
      replicas: 1
      affinity: *workerAffinity
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      # Tier B default - everything not overridden per-target above inherits this.
      # Object-state targets (kube-state-metrics, Longhorn, ArgoCD, MetalLB,
      # cloudflared, gatus, self-monitoring) change on the scale of minutes; 15s
      # buys nothing there.
      scrapeInterval: 60s
      priorityClassName: homelab-monitoring
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits: { cpu: 200m, memory: 512Mi }
      # Time bound is generous on purpose - it isn't the disk guard.
      # retentionSize is: it caps growth before the 10Gi PVC below fills, even if
      # the active-series estimate the scrape/relabel config above is tuned
      # against turns out low.
      retention: 31d
      retentionSize: 8GiB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn-bulk
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
      # ~40-60 5m-resolution series (node CPU/mem/thermal, per-namespace container
      # CPU/RSS, Longhorn volume size, ingress RPS/5xx per host, ArgoCD synced
      # count) so a full-window Grafana panel reads recorded points instead of
      # every raw 15s/60s sample. Query-speed layer only - raw data stays at full
      # resolution for the whole 31d retention regardless. ruleSelectorNilUsesHelmValues
      # (default true) already matches templates/recording-rules.yaml's
      # release: {{ .Release.Name }} label - no override needed here.

# blackbox-exporter: replaces Gatus's up/down checks (gatus/values.yaml's endpoints
# list) as Prometheus targets/alerts, since Gatus is going away. Gatus itself is left
# running untouched until that happens - this doesn't duplicate its email alerts, it
# just gives the same up/down signal a home in Grafana/Alertmanager too.
prometheus-blackbox-exporter:
  priorityClassName: homelab-monitoring
  affinity: *workerAffinity
  # Chart default (releaseLabel: false) would make Prometheus's
  # serviceMonitorSelectorNilUsesHelmValues: false above still pick this up fine -
  # no ServiceMonitor of our own needed, the Probe CRs below carry their own
  # target list and talk to this exporter directly.
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          preferred_ip_protocol: "ip4"
      tcp_connect:
        prober: tcp
        timeout: 5s
      dns_udp:
        prober: dns
        timeout: 5s
        dns:
          query_name: "pi.hole"
          query_type: "A"
          transport_protocol: "udp"
          preferred_ip_protocol: "ip4"

# One Probe CR per endpoint, rendered by templates/probes.yaml. url/module mirror
# gatus/values.yaml's endpoints list; keep the two files in step by hand until Gatus
# is removed, at which point this becomes the only copy.
probes:
  - name: jellyfin
    url: "http://jellyfin.jellyfin:8096/health"
    module: http_2xx
  - name: prowlarr
    url: "http://prowlarr-main.media:9696/ping"
    module: http_2xx
  - name: radarr
    url: "http://radarr-personal.media:7878/ping"
    module: http_2xx
  - name: sonarr
    url: "http://sonarr-personal.media:8989/ping"
    module: http_2xx
  - name: transmission
    url: "http://transmission.transmission:9091/transmission/web/"
    module: http_2xx
  - name: pihole-web
    url: "http://pihole-web.pihole/admin/login"
    module: http_2xx
  - name: pihole-dns
    url: "pihole-dns-tcp-svc.pihole:53"
    module: tcp_connect
  - name: pihole-dns-resolves
    url: "pihole-dns-udp-svc.pihole:53"
    module: dns_udp
  - name: authentik
    url: "http://authentik-server.authentik/-/health/live/"
    module: http_2xx
  - name: argocd
    url: "http://argocd-server.argocd/healthz"
    module: http_2xx
  - name: longhorn
    url: "http://longhorn-frontend.longhorn-system"
    module: http_2xx
  - name: rallly
    url: "http://rallly.rallly"
    module: http_2xx
  - name: auth-edge
    url: "https://auth.glazrtom.cz/-/health/live/"
    module: http_2xx
    interval: 2m

# smartctl-exporter: disk temperature + SMART health, dell (amd64) only. orangepi's
# root disk is an eMMC/SD card SBC boot device, not a SATA/NVMe disk SMART reports on
# meaningfully, and upstream prometheus-community/smartctl-exporter has no versioned
# arm64 release (only its floating, unpinnable "master" tag does) - see
# https://github.com/prometheus-community/smartctl_exporter/issues/267. Revisit if
# that ships a versioned multi-arch build.
smartctlExporter:
  image:
    repository: prometheuscommunity/smartctl-exporter
    tag: "v0.14.0"
  port: 9633
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 50m, memory: 32Mi }
