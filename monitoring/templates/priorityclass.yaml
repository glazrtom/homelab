# Ranks above every workload chart in this repo (none of which set one, so they
# default to 0) so the kubelet's eviction ranking - QoS class first, then priority -
# never picks the monitoring stack under memory pressure. Guaranteed QoS (requests
# == limits on Prometheus/Alertmanager, set in values.yaml) does the rest; priority
# alone only breaks ties within the same QoS class.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-monitoring
value: 1000000
globalDefault: false
description: Evicted last - monitors the workloads that would otherwise be evicted first.
