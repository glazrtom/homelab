namespace: excalidash

app:
  name: excalidash
  domainPrefix: excalidash
  port: 80

# The subchart's frontend nginx fronts the backend and serves /api and /socket.io.
service:
  name: excalidash-frontend
  port: 80

ingress:
  enabled: true
  external: true
  auth: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m

excalidash:
  fullnameOverride: excalidash
  secrets:
    existingSecret: excalidash-secrets
  database:
    provider: postgresql
  postgresql:
    enabled: true
    auth:
      existingSecret: excalidash-secrets
    persistence:
      storageClass: longhorn
      size: 2Gi
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 1000m, memory: 128Mi}
  # Still mounted at /app/prisma for the backend's persisted secret files.
  persistence:
    storageClass: longhorn
    size: 1Gi
    annotations:
      argocd.argoproj.io/sync-options: Delete=false,Prune=false
  frontend:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 200m, memory: 32Mi}
  backend:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {cpu: 500m, memory: 256Mi}
    # OIDC_CLIENT_SECRET, reflected from authentik (authentik/generate-secret.sh).
    extraEnvFrom:
      - secretRef:
          name: excalidash-oidc-client
    env:
      # local + OIDC: the first-run setup code still works, SSO is the normal path.
      authMode: hybrid
      # Hops in front of the backend: nginx-external (or -internal) + frontend nginx.
      trustProxy: "2"
      # Public URL first (OIDC redirect URI derives from it), LAN host second.
      frontendUrl: "https://excalidash.glazrtom.cz,http://excalidash.internal"
      # TLS ends at Cloudflare; the internal host is plain http.
      enforceHttpsRedirect: "false"
  oidc:
    enabled: true
    providerName: Authentik
    issuerUrl: "https://auth.glazrtom.cz/application/o/excalidash-oidc/"
    clientId: excalidash
    jitProvisioning: "true"
    # Authentik's managed email scope always sends email_verified: false.
    requireEmailVerified: "false"
