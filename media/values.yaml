global:
  imagePullPolicy: IfNotPresent
  namespace: media
  # Shared across prowlarr/radarr/sonarr's exportarr sidecar (media/templates/_exportarr.tpl) -
  # global is the only values scope subcharts see besides their own.
  exportarr:
    image:
      repository: ghcr.io/onedr0p/exportarr
      tag: "v2.3.0"
    port: 9707
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 50m, memory: 64Mi }

defineGlobalPvc:
  enabled: false

defineSharedAuth:
  enabled: false

prowlarr:
  enabled: false
  app:
    name: prowlarr
    port: 9696
  image:
    repository: linuxserver/prowlarr
    tag: "2.5.2"
  ingress:
    enabled: true
    external: true
    auth: true
  volumes:
    config:
      create: true
      size: 1Gi
      storageClassName: longhorn
      mountPath: /config
  sidecarsTemplate: prowlarr.sidecars
  extraEnvTemplate: media.authEnv
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
  vpn:
    image: qmcgaw/gluetun
    env:
      VPN_SERVICE_PROVIDER: windscribe
      VPN_TYPE: openvpn
      SERVER_REGIONS: Czech Republic
      DNS_KEEP_NAMESERVER: "on"
      FIREWALL: "on"
      FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/15
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
    secretEnv:
      OPENVPN_USER:
        name: windscribe-auth
        key: username
      OPENVPN_PASSWORD:
        name: windscribe-auth
        key: password

radarr:
  enabled: false
  app:
    name: radarr
    port: 7878
  image:
    repository: linuxserver/radarr
    tag: "6.3.0"
  ingress:
    enabled: true
    external: true
    auth: true
  extraEnvTemplate: media.authEnv
  sidecarsTemplate: media.exportarrContainer
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
  volumes:
    config:
      create: true
      size: 1Gi
      storageClassName: longhorn
      mountPath: /config
    media:
      claimName: media-pvc
      mountPath: /media

sonarr:
  enabled: false
  app:
    name: sonarr
    port: 8989
  image:
    repository: linuxserver/sonarr
    tag: "4.0.19"
  ingress:
    enabled: true
    external: true
    auth: true
  extraEnvTemplate: media.authEnv
  sidecarsTemplate: media.exportarrContainer
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
  volumes:
    config:
      create: true
      size: 1Gi
      storageClassName: longhorn
      mountPath: /config
    media:
      claimName: media-pvc
      mountPath: /media
