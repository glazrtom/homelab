apiVersion: v2
name: media
description:  Helm chart for media apps (Prowlarr, Radarr, Sonarr)
version: 0.1.0
dependencies:
  - name: lib
    version: 0.1.0
    repository: file://../lib
  - name: prowlarr
    version: 0.1.0
    repository: file://charts/prowlarr
    condition: prowlarr.enabled
  - name: radarr
    version: 0.1.0
    repository: file://charts/radarr
    condition: radarr.enabled
  - name: sonarr
    version: 0.1.0
    repository: file://charts/sonarr
    condition: sonarr.enabled
