apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-init
  namespace: {{ include "lib.namespace" . }}
data:
  10-enable-metrics.sh: |
    #!/bin/sh
    # Rewrites in place via cat (not sed -i) so system.xml keeps its owner - Jellyfin runs
    # as the PUID user and must still be able to save its own config. On the very first
    # boot the file doesn't exist yet, so metrics switch on from the second start.
    f=/config/system.xml
    [ -f "$f" ] || exit 0
    sed 's|<EnableMetrics>false</EnableMetrics>|<EnableMetrics>true</EnableMetrics>|' "$f" > /tmp/system.xml
    cmp -s /tmp/system.xml "$f" || cat /tmp/system.xml > "$f"
