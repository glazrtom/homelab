namespace: jellyfin

image:
  repository: linuxserver/jellyfin
  tag: "10.11.11"
  pullPolicy: IfNotPresent

app:
  name: jellyfin
  port: 8096
  domainPrefix: jellyfin

ingress:
  enabled: true
  external: true
  # Gated on both hosts. Native TV/mobile clients don't get an escape hatch - instead
  # their own auth/API paths are excluded from the forward-auth check via the
  # gatedApps skipPathRegex in authentik/values.yaml.
  auth: true

volumes:
  config:
    create: true
    size: 5Gi
    storageClassName: longhorn
    mountPath: /config
  media:
    claimName: media-pvc
    mountPath: /media

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "4"
    memory: 4Gi

probes:
  readinessProbe:
    httpGet:
      path: /health
      port: 8096
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /health
      port: 8096
    initialDelaySeconds: 60
    periodSeconds: 60
    failureThreshold: 3

# Hardware transcoding (RKMPP) needs the legacy BSP kernel (linux-image-legacy-rockchip64) -
# the mainline current-rockchip64 kernel this cluster runs exposes only V4L2 stateless codec
# devices, which jellyfin-ffmpeg cannot drive. Uncomment once the node is on the legacy kernel.
# devices:
#   dri:
#     path: /dev/dri
#   mali:
#     path: /dev/mali0
#   mpp:
#     path: /dev/mpp_service
#   rga:
#     path: /dev/rga
# podSecurityContext:
#   supplementalGroups: [990, 44]  # render, video (as seen on orangepi)
