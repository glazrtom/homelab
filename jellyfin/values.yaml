namespace: jellyfin

image:
  repository: linuxserver/jellyfin
  tag: "10.11.11"
  pullPolicy: IfNotPresent

app:
  name: jellyfin
  port: 8096
  domainPrefix: jellyfin
  # Named so the PodMonitor can scrape Jellyfin's own /metrics.
  ports:
    - name: http
      containerPort: 8096

ingress:
  enabled: true
  external: true
  # Gated on both hosts. Native TV/mobile clients don't get an escape hatch - instead
  # their own auth/API paths are excluded from the forward-auth check via the
  # gatedApps skipPathRegex in authentik/values.yaml.
  auth: true

nodeSelector:
  homelab/gpu: intel

volumes:
  config:
    create: true
    size: 5Gi
    storageClassName: longhorn
    mountPath: /config
  media:
    claimName: media-pvc
    mountPath: /media

# Runs as root before Jellyfin starts (linuxserver custom-cont-init.d) and turns on its
# built-in /metrics endpoint, which system.xml ships disabled. defaultMode 493 = 0755,
# since the init system only runs executable scripts. /metrics sits behind the same
# forward-auth gate as the rest of the host.
configMapVolumes:
  init:
    name: jellyfin-init
    mountPath: /custom-cont-init.d
    defaultMode: 493

# rebelcore/jellyfin-exporter: sessions, transcodes (incl. hardware-accel or not), library
# counts, task state. Needs an API key (generate-secret.sh). It is a restartPolicy: Always
# init sidecar, so a missing secret blocks Jellyfin itself from starting - seal it first.
sidecarsTemplate: jellyfin.exporterContainer
exporter:
  image:
    repository: rebelcore/jellyfin-exporter
    tag: v1.5.2
  port: 9594
  secret:
    name: jellyfin-exporter
    key: JELLYFIN_TOKEN
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 32Mi

# Transcode scratch stays off the 2-replica Longhorn config volume: ffmpeg writes GBs
# per episode, which Longhorn would replicate across nodes.
emptyDirVolumes:
  transcodes:
    mountPath: /config/cache/transcodes
    sizeLimit: 20Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
    gpu.intel.com/i915: "1"
  limits:
    cpu: "4"
    memory: 1Gi
    gpu.intel.com/i915: "1"

podSecurityContext:
  supplementalGroups: [993]  # render on dell

probes:
  readinessProbe:
    httpGet:
      path: /health
      port: 8096
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /health
      port: 8096
    initialDelaySeconds: 60
    periodSeconds: 60
    failureThreshold: 3

# Intel QuickSync transcoding on dell: applications/core/intel-gpu-plugin.yaml runs the
# upstream device plugin DaemonSet, which advertises gpu.intel.com/i915 and hands the pod
# /dev/dri/renderD128 via CDI, no hostPath/privileged access needed here.
