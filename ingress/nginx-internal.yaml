apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: nginx-internal
  namespace: ingress
spec:
  chart: ingress-nginx
  repo: https://kubernetes.github.io/ingress-nginx
  targetNamespace: ingress
  version: 4.15.1
  valuesContent: |-
    controller:
      ingressClassResource:
        name: nginx-internal
        default: false
      ingressClass: nginx-internal
      service:
        annotations:
          metallb.universe.tf/loadBalancerIPs: "10.0.0.150"
