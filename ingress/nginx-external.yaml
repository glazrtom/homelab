apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: nginx-external
  namespace: ingress
spec:
  chart: ingress-nginx
  repo: https://kubernetes.github.io/ingress-nginx
  targetNamespace: ingress
  version: 4.15.1
  valuesContent: |-
    controller:
      ingressClassResource:
        name: nginx-external
        default: false
      ingressClass: nginx-external
      service:
        annotations:
          metallb.universe.tf/loadBalancerIPs: "10.0.0.151"
      config:
        # Trust forwarded headers
        use-forwarded-headers: "true"
        
        # Map Cloudflare scheme to a real scheme
        map-hash-bucket-size: "128"
        http-snippet: |
          map $http_cf_visitor $real_scheme {
            default $scheme;
            ~*"https" https;
          }
        
        # Override headers sent to backends
        proxySetHeaders:
          X-Forwarded-Proto: "$real_scheme"

        # Global Authentik
        # Authentik resolves which application gates a host from X-Forwarded-Host,
        # so the auth subrequest must carry it - nginx would otherwise send the
        # outpost's own service address. Hosts exempt themselves with
        # nginx.ingress.kubernetes.io/enable-global-auth: "false".
        global-auth-snippet: |
          proxy_set_header X-Forwarded-Host $http_host;
        enable-forwarded-headers: "true"
        global-auth-url: "http://ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx"
        global-auth-signin: "https://auth.glazrtom.cz/outpost.goauthentik.io/start?rd=$escaped_request_uri"
        global-auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid"
