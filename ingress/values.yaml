namespace: ingress

# Single source for the upstream chart coordinates; Renovate bumps `version` here.
chart:
  name: ingress-nginx
  repo: https://kubernetes.github.io/ingress-nginx
  version: "4.15.1"

# Class name and MetalLB LB IP for each come from global.ingress.<key>.
controllers:
  internal: {}
  external:
    configTemplate: ingress.externalConfig
