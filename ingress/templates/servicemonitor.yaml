{{- if .Values.global.monitoring.serviceMonitors }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ingress-nginx
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["controller"]
  endpoints:
    - port: metrics
      interval: {{ .Values.global.monitoring.interval.fast }}
      # Keep the requests/error/cert-expiry counters the curated dashboards use, the
      # one request-duration histogram, and drop the rest (Go runtime metrics, other
      # histograms) - the largest single source of ingress-nginx series otherwise.
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "nginx_ingress_controller_(requests|request_duration_seconds_bucket|ssl_expire_time_seconds)"
          action: keep
{{- end }}
