replicaCount: 1
namespace: plex

image:
  repository: plexinc/pms-docker
  tag: 1.41.6.9685-d301f511a
  pullPolicy: IfNotPresent

env:
  version: docker

domainPrefix: plex

# Plex clients can't follow a browser SSO redirect, so this host is not gated by
# Authentik at all - it relies on Plex's own accounts. Opting out has to be explicit:
# without this the controller's default sends the host to an outpost that has no
# application for it, and every request is denied.
ingress:
  annotations:
    nginx.ingress.kubernetes.io/enable-global-auth: "false"

volumes:
  config:
    size: 10Gi
    storageClassName: longhorn
