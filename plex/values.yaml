replicaCount: 1
namespace: plex

image:
  repository: plexinc/pms-docker
  tag: 1.41.6.9685-d301f511a
  pullPolicy: IfNotPresent

env:
  version: docker

domainPrefix: plex

# Plex clients can't follow a browser SSO redirect, so this is where an
# nginx.ingress.kubernetes.io/enable-global-auth: "false" goes if they break.
ingress:
  annotations: {}

volumes:
  config:
    size: 10Gi
    storageClassName: longhorn
