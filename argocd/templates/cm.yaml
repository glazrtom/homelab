{{/*
Overrides the argocd-cm upstream install.yaml ships empty. Adds the apiKey-only CI
account used by the GitHub Actions deploy-gate workflow (see ingress-ci.yaml,
rbac-cm.yaml) - apiKey (not login) means it can hold a generated token but never a UI
session.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://{{ .Values.app.domainPrefix }}.{{ .Values.global.domain.public.suffix }}
  {{- if .Values.ci.enabled }}
  accounts.{{ .Values.ci.account }}: apiKey
  {{- end }}
  {{- if .Values.oidc.enabled }}
  # Public issuer only - the browser SSO session from Authentik forward-auth on
  # argo.internal doesn't carry over, since ArgoCD's callback is always built from
  # the public `url` above. See CLAUDE.md for the LAN break-glass path.
  oidc.config: |
    name: {{ .Values.oidc.name }}
    issuer: https://{{ .Values.oidc.authPrefix }}.{{ .Values.global.domain.public.suffix }}/application/o/{{ .Values.oidc.slug }}/
    clientID: {{ .Values.oidc.clientId }}
    enablePKCEAuthentication: true
    requestedScopes: ["openid", "profile", "email"]
  {{- end }}
