namespace: argocd

app:
  name: argocd
  domainPrefix: argo
  port: 80

# Upstream install.yaml names the server Service argocd-server.
service:
  name: argocd-server
  port: 80

ingress:
  enabled: true
  external: true
  auth: true

# Browser SSO on top of the forward-auth gate above, via a public/PKCE OIDC client
# (see authentik/values.yaml argocdOidc). Local admin login stays enabled as
# break-glass - see CLAUDE.md.
oidc:
  enabled: true
  name: authentik
  clientId: argocd
  slug: argocd-oidc
  authPrefix: auth
  adminGroup: homelab-admins

ci:
  enabled: true
  domainPrefix: argo-ci
  account: github-actions
  rateLimit:
    rps: 20
    connections: 20
    burstMultiplier: 5
