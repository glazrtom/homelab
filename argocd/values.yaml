namespace: argocd

app:
  name: argocd
  domainPrefix: argo
  port: 80

# Upstream install.yaml names the server Service argocd-server.
service:
  name: argocd-server
  port: 80

ingress:
  enabled: true
  external: true
  auth: true

ci:
  enabled: true
  domainPrefix: argo-ci
  account: github-actions
  rateLimit:
    rps: 20
    connections: 20
    burstMultiplier: 5
