apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress-external
  namespace: argocd
  annotations:
    # Gated by the argocd-forward-auth provider (declared in authentik/values.yaml)
    # rather than the controller's catch-all, so only homelab-admins get in. What
    # lib.authOutpost renders for chart-based apps is hand-written below, since
    # argocd/ is plain manifests.
    nginx.ingress.kubernetes.io/auth-url: http://ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://argo.glazrtom.fun/outpost.goauthentik.io/start?rd=$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid
    nginx.ingress.kubernetes.io/auth-proxy-set-headers: argocd/authentik-auth-headers
spec:
  ingressClassName: nginx-external
  rules:
#   TODO: Change host to values
    - host: argo.glazrtom.fun
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-outpost
                port:
                  number: 9000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-outpost
  namespace: argocd
spec:
  type: ExternalName
  externalName: ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local
  ports:
    - port: 9000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-auth-headers
  namespace: argocd
data:
  # Authentik resolves which application gates a host from X-Forwarded-Host; the
  # auth subrequest would otherwise carry the outpost's own service address.
  X-Forwarded-Host: $http_host
