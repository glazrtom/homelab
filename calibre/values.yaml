replicaCount: 1
namespace: calibre

image:
  repository: linuxserver/calibre-web
  tag: latest
  pullPolicy: IfNotPresent

domainPrefix: calibre

# nginx-internal denies by default; calibre has no gatedApps entry and its ingress is
# hand-written (not lib.ingress), so it opts out explicitly like plex does.
ingress:
  annotations:
    nginx.ingress.kubernetes.io/enable-global-auth: "false"

volumes:
  config:
    size: 1Gi
    path: /mnt/storage/config/calibre
  books:
    size: 100Gi
    path: /mnt/storage/media/books
