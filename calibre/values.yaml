replicaCount: 1
namespace: calibre

image:
  repository: linuxserver/calibre-web
  tag: latest@sha256:e7debaaec01a02a9e524d888209c590ab5c77a25546723f9b73a3bd32d946cfc
  pullPolicy: IfNotPresent

domainPrefix: calibre

# nginx-internal denies by default; calibre has no gatedApps entry and its ingress is
# hand-written (not lib.ingress), so it opts out explicitly.
ingress:
  annotations:
    nginx.ingress.kubernetes.io/enable-global-auth: "false"

volumes:
  config:
    size: 1Gi
    path: /mnt/storage/config/calibre
  books:
    size: 100Gi
    path: /mnt/storage/media/books
