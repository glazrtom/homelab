apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: {{ include "lib.namespace" . }}
data:
  brand.yaml: |
    version: 1
    metadata:
      name: homelab - Brand
    entries:
      # Brand.default_locale is read-only, derived from attributes.settings.locale.
      # attrs replaces `attributes` wholesale, so keep future brand settings here too.
      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
          default: true
        attrs:
          attributes:
            settings:
              locale: en
