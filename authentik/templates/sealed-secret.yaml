---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  encryptedData:
    AUTHENTIK_BOOTSTRAP_EMAIL: 
    AUTHENTIK_BOOTSTRAP_PASSWORD: 
    AUTHENTIK_BOOTSTRAP_TOKEN: 
    AUTHENTIK_POSTGRESQL__PASSWORD: 
    AUTHENTIK_SECRET_KEY: 
    CALIBRE_OIDC_CLIENT_SECRET: 
    JELLYFIN_OIDC_CLIENT_ID: 
    JELLYFIN_OIDC_CLIENT_SECRET: 
    JELLYFIN_OIDC_INTERNAL_CLIENT_ID: 
    JELLYFIN_OIDC_INTERNAL_CLIENT_SECRET: 
    LDAP_BIND_KEY: 
  template:
    metadata:
      name: authentik-secrets
      namespace: authentik
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: excalidash-oidc-client
  namespace: authentik
spec:
  encryptedData:
    OIDC_CLIENT_SECRET: 
  template:
    metadata:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: excalidash
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: excalidash
      name: excalidash-oidc-client
      namespace: authentik
---
