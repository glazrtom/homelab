{{- $public := .Values.global.domain.public.suffix }}
{{- $internal := .Values.global.domain.internal.suffix }}
{{- $ldapGroup := .Values.ldapGroup }}
{{- $users := .Values.users }}
{{- $groups := list $ldapGroup }}
{{- if .Values.argocdOidc.enabled }}
{{- $groups = append $groups .Values.argocdOidc.group }}
{{- end }}
{{- if .Values.excalidashOidc.enabled }}
{{- $groups = append $groups .Values.excalidashOidc.group }}
{{- end }}
{{- if .Values.calibreOidc.enabled }}
{{- $groups = append $groups .Values.calibreOidc.group }}
{{- end }}
{{- if .Values.ralllyOidc.enabled }}
{{- $groups = append $groups .Values.ralllyOidc.group }}
{{- end }}
{{- range $name, $u := $users }}
{{- if not $u.groups }}
{{- fail (printf "users.%s needs at least one group" $name) }}
{{- end }}
{{- $groups = concat $groups $u.groups }}
{{- end }}

{{/*
Flatten gatedApps into one entry per host. A proxy provider carries a single
external_host and the outpost keys its application map on it, so covering both the
public and the internal host of a service takes two providers - generated here from
one gatedApps entry so their policy binding is necessarily identical. The two lists
are kept apart because each attaches to a different outpost below.
*/}}
{{- $publicVariants := list }}
{{- $internalVariants := list }}
{{- range $app := .Values.gatedApps }}
{{- $appGroups := $app.groups | default list }}
{{- $appUsers := $app.users | default list }}
{{- if not (or $appGroups $appUsers) }}
{{- fail (printf "gatedApps entry %s needs groups and/or users, or nobody can reach it" $app.slug) }}
{{- end }}
{{- range $u := $appUsers }}
{{- if not (hasKey $users $u) }}
{{- fail (printf "gatedApps entry %s lists user %s, which is not in the users map" $app.slug $u) }}
{{- end }}
{{- end }}
{{- $groups = concat $groups $appGroups }}
{{- $extHost := $app.externalHost | default (printf "%s.%s" $app.prefix $public) }}
{{- $publicVariants = append $publicVariants (dict "id" $app.slug "slug" $app.slug "name" $app.name "groups" $appGroups "users" $appUsers "skip" $app.skipPathRegex "url" (printf "https://%s" $extHost)) }}
{{- $internalVariants = append $internalVariants (dict "id" (printf "%s-internal" $app.slug) "slug" $app.slug "name" (printf "%s (internal)" $app.name) "groups" $appGroups "users" $appUsers "skip" $app.skipPathRegex "url" (printf "http://%s.%s" $app.prefix $internal)) }}
{{- end }}
{{- $variants := concat $publicVariants $internalVariants }}

{{/* Jellyfin's own host prefix, shared with its gatedApps entry so the OIDC redirect
URIs below can't drift from the forward-auth host they sit alongside. */}}
{{- $jellyfinApp := "" }}
{{- range $app := .Values.gatedApps }}
{{- if eq $app.slug "jellyfin" }}
{{- $jellyfinApp = $app }}
{{- end }}
{{- end }}
{{- if not $jellyfinApp }}
{{- fail "blueprint-access.yaml expects a gatedApps entry with slug: jellyfin for the Jellyfin OIDC provider's redirect_uris" }}
{{- end }}

{{/* ArgoCD's own host prefix, shared with its gatedApps entry for the same reason as
Jellyfin's above - the OIDC redirect_uri can't drift from the forward-auth host it
sits alongside. */}}
{{- $argocdApp := "" }}
{{- range $app := .Values.gatedApps }}
{{- if eq $app.slug "argocd" }}
{{- $argocdApp = $app }}
{{- end }}
{{- end }}
{{- if and .Values.argocdOidc.enabled (not $argocdApp) }}
{{- fail "blueprint-access.yaml expects a gatedApps entry with slug: argocd for the ArgoCD OIDC provider's redirect_uri" }}
{{- end }}

{{/* ExcaliDash's own host prefix, shared with its gatedApps entry so the OIDC
redirect_uri can't drift from the forward-auth host it sits alongside. */}}
{{- $excalidashApp := "" }}
{{- range $app := .Values.gatedApps }}
{{- if eq $app.slug "excalidash" }}
{{- $excalidashApp = $app }}
{{- end }}
{{- end }}
{{- if and .Values.excalidashOidc.enabled (not $excalidashApp) }}
{{- fail "blueprint-access.yaml expects a gatedApps entry with slug: excalidash for the ExcaliDash OIDC provider's redirect_uri" }}
{{- end }}

{{/* Calibre's own host prefix, shared with its gatedApps entry so the OIDC
redirect_uri can't drift from the forward-auth host it sits alongside. */}}
{{- $calibreApp := "" }}
{{- range $app := .Values.gatedApps }}
{{- if eq $app.slug "calibre" }}
{{- $calibreApp = $app }}
{{- end }}
{{- end }}
{{- if and .Values.calibreOidc.enabled (not $calibreApp) }}
{{- fail "blueprint-access.yaml expects a gatedApps entry with slug: calibre for the Calibre OIDC provider's redirect_uri" }}
{{- end }}

{{/* Rallly's own host prefix, shared with its gatedApps entry so the OIDC
redirect_uri can't drift from the forward-auth host it sits alongside. */}}
{{- $ralllyApp := "" }}
{{- range $app := .Values.gatedApps }}
{{- if eq $app.slug "rallly" }}
{{- $ralllyApp = $app }}
{{- end }}
{{- end }}
{{- if and .Values.ralllyOidc.enabled (not $ralllyApp) }}
{{- fail "blueprint-access.yaml expects a gatedApps entry with slug: rallly for the Rallly OIDC provider's redirect_uri" }}
{{- end }}

{{- if lt (len $variants) 2 }}
{{- fail "gatedApps must produce at least two applications: a proxy outpost serving a single application serves it for any hostname, which would defeat the per-host gating" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: {{ include "lib.namespace" . }}
data:
  # Applied by the worker from /blueprints/mounted/cm-authentik-blueprints/access.yaml.
  # BlueprintInstance is keyed on that path, so renaming this ConfigMap or the key
  # below orphans the old instance into a permanently-failing state.
  #
  # `state: created` marks seed-only entries: either they carry a credential that
  # must not be re-rolled, or the serializer would clobber data not declared here
  # (user accounts: passwords, MFA, profile).
  access.yaml: |
    version: 1
    metadata:
      name: homelab - Access
    entries:
      # default-authentication-flow is a built-in flow only ever referenced here by
      # slug (never defined), so its User Login stage is matched by the name Authentik
      # ships it under rather than declared fresh - this updates that existing stage in
      # place instead of creating a duplicate.
      - model: authentik_stages_user_login.userloginstage
        identifiers:
          name: default-authentication-login
        attrs:
          session_duration: days=7

      # Users come from the users map, before the groups that reference them (!KeyOf
      # only resolves entries already applied). state: created seeds a missing account
      # without ever touching an existing one, so passwords and MFA stay UI-managed.
      {{- range $name, $u := $users }}
      - model: authentik_core.user
        id: user-{{ $name }}
        state: created
        identifiers:
          username: {{ $name }}
        attrs:
          name: {{ $u.name | default $name | quote }}
      {{ end }}
      # Group membership is declared in values: the importer builds a non-partial
      # serializer, so every apply sets `users` to exactly this list and reverts
      # membership edits made in the UI. Any other group field omitted here (roles,
      # parent, attributes) is likewise reset to its default.
      {{- range $group := $groups | uniq | sortAlpha }}
      {{- $members := list }}
      {{- range $name, $u := $users }}
      {{- if has $group $u.groups }}
      {{- $members = append $members $name }}
      {{- end }}
      {{- end }}
      - model: authentik_core.group
        id: group-{{ $group }}
        identifiers:
          name: {{ $group }}
        attrs:
          {{- if $members }}
          users:
            {{- range $name := $members }}
            - !KeyOf user-{{ $name }}
            {{- end }}
          {{- else }}
          users: []
          {{- end }}
      {{ end }}
      # Access to each gated app is one expression policy regenerated from values on
      # every apply, shared by the public and internal halves. Binding individual
      # groups/users per app would leave the old bindings behind when a list is
      # narrowed (blueprints never delete what an entry no longer declares), and
      # policy_engine_mode: any would keep honouring them.
      {{- range $app := .Values.gatedApps }}
      {{- $clauses := list }}
      {{- range $g := $app.groups | default list }}
      {{- $clauses = append $clauses (printf "ak_is_group_member(request.user, name=%s)" ($g | toJson)) }}
      {{- end }}
      {{- if $app.users }}
      {{- $clauses = append $clauses (printf "request.user.username in %s" ($app.users | toJson)) }}
      {{- end }}
      - model: authentik_policies_expression.expressionpolicy
        id: policy-access-{{ $app.slug }}
        identifiers:
          name: access-{{ $app.slug }}
        attrs:
          expression: |
            return {{ join " or " $clauses }}
      {{ end }}
      # --- One provider per host, no catch-all. A host absent from gatedApps matches
      # nothing and the outpost answers 400, which nginx turns into a 403 - so
      # forgetting an app, or renaming one without updating the registry, denies access
      # rather than quietly widening it.
      {{- range $v := $variants }}
      - model: authentik_providers_proxy.proxyprovider
        id: provider-{{ $v.id }}
        identifiers:
          name: {{ $v.id }}-forward-auth
        attrs:
          mode: forward_single
          external_host: {{ $v.url }}
          intercept_header_auth: true
          {{- with $v.skip }}
          skip_path_regex: |
            {{- . | trim | nindent 12 }}
          {{- end }}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: app-{{ $v.id }}
        identifiers:
          slug: {{ $v.id }}
        attrs:
          name: {{ $v.name }}
          provider: !KeyOf provider-{{ $v.id }}
          meta_launch_url: {{ $v.url }}
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-{{ $v.id }}
          policy: !KeyOf policy-access-{{ $v.slug }}
          order: 0
      {{ end }}

      # Matches the connection outpost_connection_discovery auto-creates on startup,
      # by name, so this adopts it rather than adding a duplicate.
      - model: authentik_outposts.kubernetesserviceconnection
        id: sc-local
        identifiers:
          name: Local Kubernetes Cluster
        attrs:
          local: true
          kubeconfig: {}
          verify_ssl: true

      # Every proxy provider above has to be applied before this entry: !KeyOf only
      # resolves entries that already have a model instance. service_connection is
      # pinned rather than omitted - nulling it would tear down
      # ak-outpost-authentik-embedded-outpost and deny every gated host. Carries only
      # the public providers - the internal ones are on the "internal" outpost below.
      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          type: proxy
          service_connection: !KeyOf sc-local
          providers:
            {{- range $v := $publicVariants }}
            - !KeyOf provider-{{ $v.id }}
            {{- end }}
          # For the embedded outpost, authentik_host_browser has no effect - the browser
          # redirect (authorize/end-session/issuer) is always built from authentik_host
          # itself, so this has to be the public host, not the in-cluster one; otherwise
          # browsers off-LAN get redirected to a Service DNS name they can't resolve.
          # The outpost's own API/websocket traffic to core is unaffected: for the
          # embedded outpost that always goes over localhost regardless of this value.
          config:
            authentik_host: https://{{ .Values.app.domainPrefix }}.{{ $public }}/
            kubernetes_namespace: {{ include "lib.namespace" . }}
            kubernetes_service_type: ClusterIP

      # A second, deployed (non-embedded) outpost carrying only the -internal
      # providers. Unlike the embedded one, a deployed outpost honours
      # authentik_host_browser, so LAN logins can redirect to auth.internal instead of
      # hairpinning out through Cloudflare to the public host and back.
      - model: authentik_outposts.outpost
        identifiers:
          name: internal
        attrs:
          type: proxy
          service_connection: !KeyOf sc-local
          providers:
            {{- range $v := $internalVariants }}
            - !KeyOf provider-{{ $v.id }}
            {{- end }}
          config:
            # The pod talks to core over the in-cluster Service, not auth.internal,
            # which only Pi-hole (not cluster DNS) resolves.
            authentik_host: http://{{ .Values.service.name }}.{{ include "lib.namespace" . }}.svc.cluster.local/
            authentik_host_browser: http://{{ .Values.app.domainPrefix }}.{{ $internal }}/
            kubernetes_namespace: {{ include "lib.namespace" . }}
            kubernetes_service_type: ClusterIP
            # This Deployment is created by the outpost controller, not Helm, so
            # global.priorityClassName above doesn't reach it - patch it directly.
            kubernetes_json_patches:
              deployment:
                - op: add
                  path: /spec/template/spec/priorityClassName
                  value: homelab-authentik

      # The backchannel link is only writable from the Application side
      # (LDAPProviderSerializer doesn't expose it), so the provider must be
      # declared first for !KeyOf provider-ldap to resolve below.
      - model: authentik_providers_ldap.ldapprovider
        id: provider-ldap
        identifiers:
          name: homelab-ldap
        attrs:
          base_dn: DC=ldap,DC={{ $public | replace "." ",DC=" }}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          bind_mode: cached
          search_mode: cached
          mfa_support: false

      - model: authentik_core.application
        id: app-ldap
        identifiers:
          slug: ldap
        attrs:
          name: LDAP
          policy_engine_mode: any
          backchannel_providers:
            - !KeyOf provider-ldap

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-ldap
          group: !KeyOf group-{{ $ldapGroup }}
          order: 0

      # authentik_host must be the in-cluster URL: the public one is forward-auth'd,
      # which would block the outpost's own websocket back to authentik.
      - model: authentik_outposts.outpost
        identifiers:
          name: ldap
        attrs:
          type: ldap
          service_connection: !KeyOf sc-local
          providers:
            - !KeyOf provider-ldap
          config:
            authentik_host: http://{{ .Values.service.name }}.{{ include "lib.namespace" . }}.svc.cluster.local/
            kubernetes_namespace: {{ include "lib.namespace" . }}
            kubernetes_replicas: 1
            kubernetes_service_type: ClusterIP
            kubernetes_json_patches:
              deployment:
                - op: add
                  path: /spec/template/spec/priorityClassName
                  value: homelab-authentik

      # search_full_directory is granted on the user directly: the group -> role path
      # is not blueprintable, GroupRole being an internally-managed through-model.
      - model: authentik_core.user
        id: user-ldap-bind
        state: created
        identifiers:
          username: ldap-bind
        attrs:
          name: LDAP Bind Service Account
          type: service_account
          path: goauthentik.io/service-accounts
          permissions:
            - authentik_providers_ldap.search_full_directory
            - authentik_core.view_user
            - authentik_core.view_group

      # Bound by user rather than via homelab-users, which would mean declaring that
      # group's whole membership here.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-ldap
          user: !KeyOf user-ldap-bind
          order: 1

      # An app_password token rather than a plain user password, so the bind keeps
      # working if MFA is ever added to default-authentication-flow. state: created so
      # the key is never re-rolled out from under Jellyfin's PVC-stored plugin config.
      - model: authentik_core.token
        state: created
        identifiers:
          identifier: ldap-bind-password
        attrs:
          user: !KeyOf user-ldap-bind
          intent: app_password
          expiring: false
          key: !Env LDAP_BIND_KEY
          description: LDAP bind password for the Jellyfin LDAP-Authentication plugin

      # Browser SSO for Jellyfin, separate from the LDAP path above: forward-auth's
      # headers stop at nginx, so the pre-existing authentik session is only usable by
      # Jellyfin through a real OIDC round-trip. Native clients that can't follow the
      # browser redirect keep using LDAP.
      #
      # Split into public/internal variants for the same reason the proxy providers
      # above are: auth.internal and auth.glazrtom.cz don't share a session cookie, so
      # a browser forward-auth'd on one has no session on the other. The Jellyfin OIDC
      # plugin picks a fixed issuer host per provider config with no per-request
      # switching, so making the LAN hop invisible - and keeping it off Cloudflare -
      # needs its own client and its own callback path, not just a second redirect_uri
      # on a shared one. Not state: created - unlike the LDAP token these carry no
      # value that must survive untouched, and the redirect URIs need to stay
      # updatable.
      {{- range $v := list (dict "id" "authentik" "suffix" "" "scheme" "https" "host" $public) (dict "id" "authentik-internal" "suffix" "-internal" "scheme" "http" "host" $internal) }}
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-jellyfin-oidc{{ $v.suffix }}
        identifiers:
          name: jellyfin-oidc{{ $v.suffix }}
        attrs:
          client_type: confidential
          client_id: !Env JELLYFIN_OIDC{{ $v.suffix | upper | replace "-" "_" }}_CLIENT_ID
          client_secret: !Env JELLYFIN_OIDC{{ $v.suffix | upper | replace "-" "_" }}_CLIENT_SECRET
          # grant_types defaults to an empty list - without it the authorize view
          # rejects every response_type=code request with "Invalid grant_type for
          # provider" before it ever reaches redirect_uri/consent checks.
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: user_username
          include_claims_in_id_token: true
          redirect_uris:
            - url: {{ $v.scheme }}://{{ $jellyfinApp.prefix }}.{{ $v.host }}/sso/OIDC/Callback/{{ $v.id }}
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        id: app-jellyfin-oidc{{ $v.suffix }}
        identifiers:
          slug: jellyfin-oidc{{ $v.suffix }}
        attrs:
          name: Jellyfin (OIDC{{ if $v.suffix }} - internal{{ end }})
          provider: !KeyOf provider-jellyfin-oidc{{ $v.suffix }}
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-jellyfin-oidc{{ $v.suffix }}
          group: !KeyOf group-{{ $ldapGroup }}
          order: 0
      {{ end }}
      {{- if .Values.argocdOidc.enabled }}
      # Browser SSO into ArgoCD, on top of the forward-auth gate the argocd
      # gatedApps entry already sets up. Public client (PKCE, no client_secret) -
      # unlike Jellyfin's providers there's no !Env secret pair here. Public issuer
      # only: argocd-cm's oidc.config is a single issuer, so there's no LAN-only
      # variant to split off the way the proxy providers and Jellyfin's OIDC are.
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-argocd-oidc
        identifiers:
          name: argocd-oidc
        attrs:
          client_type: public
          client_id: {{ .Values.argocdOidc.clientId }}
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: user_username
          include_claims_in_id_token: true
          redirect_uris:
            - url: https://{{ $argocdApp.prefix }}.{{ $public }}/auth/callback
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        id: app-argocd-oidc
        identifiers:
          slug: {{ .Values.argocdOidc.slug }}
        attrs:
          name: ArgoCD (OIDC)
          provider: !KeyOf provider-argocd-oidc
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-argocd-oidc
          group: !KeyOf group-{{ .Values.argocdOidc.group }}
          order: 0
      {{- end }}
      {{- if .Values.excalidashOidc.enabled }}
      # Browser SSO into ExcaliDash, on top of its forward-auth gate. Confidential
      # (unlike ArgoCD's): ExcaliDash rejects a public client because Authentik never
      # advertises token auth method "none". Public issuer only.
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-excalidash-oidc
        identifiers:
          name: excalidash-oidc
        attrs:
          client_type: confidential
          client_id: {{ .Values.excalidashOidc.clientId }}
          client_secret: !Env EXCALIDASH_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: user_username
          include_claims_in_id_token: true
          redirect_uris:
            - url: https://{{ $excalidashApp.prefix }}.{{ $public }}/api/auth/oidc/callback
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        id: app-excalidash-oidc
        identifiers:
          slug: {{ .Values.excalidashOidc.slug }}
        attrs:
          name: ExcaliDash (OIDC)
          provider: !KeyOf provider-excalidash-oidc
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-excalidash-oidc
          group: !KeyOf group-{{ .Values.excalidashOidc.group }}
          order: 0
      {{- end }}

      {{- if .Values.calibreOidc.enabled }}
      # Browser SSO into Calibre-Web Automated, on top of its forward-auth gate.
      # Confidential; both hosts. CWA's callback path is /login/generic/authorized.
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-calibre-oidc
        identifiers:
          name: calibre-oidc
        attrs:
          client_type: confidential
          client_id: {{ .Values.calibreOidc.clientId }}
          client_secret: !Env CALIBRE_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: user_username
          include_claims_in_id_token: true
          redirect_uris:
            - url: https://{{ $calibreApp.prefix }}.{{ $public }}/login/generic/authorized
              matching_mode: strict
            - url: http://{{ $calibreApp.prefix }}.{{ $internal }}/login/generic/authorized
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        id: app-calibre-oidc
        identifiers:
          slug: {{ .Values.calibreOidc.slug }}
        attrs:
          name: Calibre (OIDC)
          provider: !KeyOf provider-calibre-oidc
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-calibre-oidc
          group: !KeyOf group-{{ .Values.calibreOidc.group }}
          order: 0
      {{- end }}

      {{- if .Values.ralllyOidc.enabled }}
      # Browser SSO into Rallly, on top of its forward-auth gate. Confidential; public
      # issuer only (Rallly's baseUrl is the public host). Rallly uses better-auth, so the
      # callback is /api/better-auth/oauth2/callback/oidc (/api/auth/callback/oidc only redirects there).
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-rallly-oidc
        identifiers:
          name: rallly-oidc
        attrs:
          client_type: confidential
          client_id: {{ .Values.ralllyOidc.clientId }}
          client_secret: !Env RALLLY_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: user_username
          include_claims_in_id_token: true
          redirect_uris:
            - url: https://{{ $ralllyApp.prefix }}.{{ $public }}/api/better-auth/oauth2/callback/oidc
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        id: app-rallly-oidc
        identifiers:
          slug: {{ .Values.ralllyOidc.slug }}
        attrs:
          name: Rallly (OIDC)
          provider: !KeyOf provider-rallly-oidc
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-rallly-oidc
          group: !KeyOf group-{{ .Values.ralllyOidc.group }}
          order: 0
      {{- end }}
