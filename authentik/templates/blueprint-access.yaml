{{- $public := .Values.global.domain.public.suffix }}
{{- $internal := .Values.global.domain.internal.suffix }}
{{- $ldapGroup := .Values.ldapGroup }}
{{- $groups := list $ldapGroup }}

{{/*
Flatten gatedApps into one entry per host. A proxy provider carries a single
external_host and the outpost keys its application map on it, so covering both the
public and the internal host of a service takes two providers - generated here from
one gatedApps entry so their policy binding is necessarily identical.
*/}}
{{- $variants := list }}
{{- range $app := .Values.gatedApps }}
{{- $groups = append $groups $app.group }}
{{- $extHost := $app.externalHost | default (printf "%s.%s" $app.prefix $public) }}
{{- $variants = append $variants (dict "id" $app.slug "name" $app.name "group" $app.group "skip" $app.skipPathRegex "url" (printf "https://%s" $extHost)) }}
{{- $variants = append $variants (dict "id" (printf "%s-internal" $app.slug) "name" (printf "%s (internal)" $app.name) "group" $app.group "skip" $app.skipPathRegex "url" (printf "http://%s.%s" $app.prefix $internal)) }}
{{- end }}
{{- $groups = $groups | uniq | sortAlpha }}

{{- if lt (len $variants) 2 }}
{{- fail "gatedApps must produce at least two applications: a proxy outpost serving a single application serves it for any hostname, which would defeat the per-host gating" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: {{ include "lib.namespace" . }}
data:
  # Applied by the worker from /blueprints/mounted/cm-authentik-blueprints/access.yaml.
  # BlueprintInstance is keyed on that path, so renaming this ConfigMap or the key
  # below orphans the old instance into a permanently-failing state.
  #
  # `state: created` marks seed-only entries: either they carry a credential that
  # must not be re-rolled, or the serializer would clobber data not declared here.
  access.yaml: |
    version: 1
    metadata:
      name: homelab - Access
    entries:
      # Membership stays a UI concern. GroupSerializer.users defaults to [] when
      # omitted and the importer builds a non-partial serializer, so without
      # state: created a re-apply would empty every group.
      {{- range $group := $groups }}
      - model: authentik_core.group
        id: group-{{ $group }}
        state: created
        identifiers:
          name: {{ $group }}
      {{ end }}
      # --- One provider per host, no catch-all. A host absent from gatedApps matches
      # nothing and the outpost answers 400, which nginx turns into a 403 - so
      # forgetting an app, or renaming one without updating the registry, denies access
      # rather than quietly widening it.
      {{- range $v := $variants }}
      - model: authentik_providers_proxy.proxyprovider
        id: provider-{{ $v.id }}
        identifiers:
          name: {{ $v.id }}-forward-auth
        attrs:
          mode: forward_single
          external_host: {{ $v.url }}
          intercept_header_auth: true
          {{- with $v.skip }}
          skip_path_regex: |
            {{- . | trim | nindent 12 }}
          {{- end }}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: app-{{ $v.id }}
        identifiers:
          slug: {{ $v.id }}
        attrs:
          name: {{ $v.name }}
          provider: !KeyOf provider-{{ $v.id }}
          meta_launch_url: {{ $v.url }}
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-{{ $v.id }}
          group: !KeyOf group-{{ $v.group }}
          order: 0
      {{ end }}
      # Matches the connection outpost_connection_discovery auto-creates on startup,
      # by name, so this adopts it rather than adding a duplicate.
      - model: authentik_outposts.kubernetesserviceconnection
        id: sc-local
        identifiers:
          name: Local Kubernetes Cluster
        attrs:
          local: true
          kubeconfig: {}
          verify_ssl: true

      # Every proxy provider above has to be applied before this entry: !KeyOf only
      # resolves entries that already have a model instance. service_connection is
      # pinned rather than omitted - nulling it would tear down
      # ak-outpost-authentik-embedded-outpost and deny every gated host.
      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          type: proxy
          service_connection: !KeyOf sc-local
          providers:
            {{- range $v := $variants }}
            - !KeyOf provider-{{ $v.id }}
            {{- end }}
          # Unlike authentik_host below, authentik_host_browser is what the outpost sends
          # browsers to for the authorize redirect - it must be the public host, or it
          # defaults to whatever host an admin last reached Authentik on (auth.internal),
          # which is unreachable off-LAN.
          config:
            authentik_host: http://{{ .Values.service.name }}.{{ include "lib.namespace" . }}.svc.cluster.local/
            authentik_host_browser: https://{{ .Values.app.domainPrefix }}.{{ $public }}/
            kubernetes_namespace: {{ include "lib.namespace" . }}
            kubernetes_service_type: ClusterIP

      - model: authentik_core.application
        id: app-ldap
        identifiers:
          slug: ldap
        attrs:
          name: LDAP
          policy_engine_mode: any

      # The application link lives on the provider - Application has no writable
      # backchannel_providers field, only the reverse relation.
      - model: authentik_providers_ldap.ldapprovider
        id: provider-ldap
        identifiers:
          name: homelab-ldap
        attrs:
          base_dn: DC=ldap,DC={{ $public | replace "." ",DC=" }}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          bind_mode: cached
          search_mode: cached
          mfa_support: false
          is_backchannel: true
          backchannel_application: !KeyOf app-ldap

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-ldap
          group: !KeyOf group-{{ $ldapGroup }}
          order: 0

      # authentik_host must be the in-cluster URL: the public one is forward-auth'd,
      # which would block the outpost's own websocket back to authentik.
      - model: authentik_outposts.outpost
        identifiers:
          name: ldap
        attrs:
          type: ldap
          service_connection: !KeyOf sc-local
          providers:
            - !KeyOf provider-ldap
          config:
            authentik_host: http://{{ .Values.service.name }}.{{ include "lib.namespace" . }}.svc.cluster.local/
            kubernetes_namespace: {{ include "lib.namespace" . }}
            kubernetes_replicas: 1
            kubernetes_service_type: ClusterIP

      # search_full_directory is granted on the user directly: the group -> role path
      # is not blueprintable, GroupRole being an internally-managed through-model.
      - model: authentik_core.user
        id: user-ldap-bind
        state: created
        identifiers:
          username: ldap-bind
        attrs:
          name: LDAP Bind Service Account
          type: service_account
          path: goauthentik.io/service-accounts
          permissions:
            - authentik_providers_ldap.search_full_directory
            - authentik_core.view_user
            - authentik_core.view_group

      # Bound by user rather than via homelab-users, which would mean declaring that
      # group's whole membership here.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-ldap
          user: !KeyOf user-ldap-bind
          order: 1

      # An app_password token rather than a plain user password, so the bind keeps
      # working if MFA is ever added to default-authentication-flow. state: created so
      # the key is never re-rolled out from under Jellyfin's PVC-stored plugin config.
      - model: authentik_core.token
        state: created
        identifiers:
          identifier: ldap-bind-password
        attrs:
          user: !KeyOf user-ldap-bind
          intent: app_password
          expiring: false
          key: !Env LDAP_BIND_KEY
          description: LDAP bind password for the Jellyfin LDAP-Authentication plugin
