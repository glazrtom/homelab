apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-postgres-exporter
  namespace: {{ include "lib.namespace" . }}
data:
  queries.yaml: |
    # Rolling 5-minute count per event action, not a counter: the events table is pruned
    # by authentik, which would otherwise read as a counter reset. Only `action` is a
    # label - usernames/IPs would be unbounded cardinality (the authentik UI has them).
    authentik_events:
      query: "SELECT action, count(*) AS recent FROM authentik_events_event WHERE created > now() - interval '5 minutes' GROUP BY action"
      cache_seconds: 30
      metrics:
        - action:
            usage: LABEL
            description: Authentik event action, e.g. login, login_failed, suspicious_request
        - recent:
            usage: GAUGE
            description: Events of this action in the last 5 minutes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-postgres-exporter
  namespace: {{ include "lib.namespace" . }}
  labels:
    app: authentik-postgres-exporter
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: authentik-postgres-exporter
  template:
    metadata:
      labels:
        app: authentik-postgres-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: postgres-exporter
          image: "{{ .Values.postgresExporter.image.repository }}:{{ .Values.postgresExporter.image.tag }}"
          args:
            - --extend.query-path=/etc/postgres-exporter/queries.yaml
            - --web.listen-address=:{{ .Values.postgresExporter.port }}
          env:
            - name: DATA_SOURCE_URI
              value: authentik-postgresql:5432/authentik?sslmode=disable
            - name: DATA_SOURCE_USER
              value: authentik
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_POSTGRESQL__PASSWORD
          ports:
            - name: metrics
              containerPort: {{ .Values.postgresExporter.port }}
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: queries
              mountPath: /etc/postgres-exporter
              readOnly: true
          resources:
            {{- toYaml .Values.postgresExporter.resources | nindent 12 }}
      volumes:
        - name: queries
          configMap:
            name: authentik-postgres-exporter
{{- if .Values.global.monitoring.serviceMonitors }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-postgres-exporter
  namespace: {{ include "lib.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app: authentik-postgres-exporter
  podMetricsEndpoints:
    - port: metrics
      interval: {{ .Values.global.monitoring.interval.slow }}
{{- end }}
