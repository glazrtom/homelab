# Applies authentik-blueprints synchronously after every sync, instead of waiting on the
# worker's own hourly discovery (or a ConfigMap volume update it doesn't reliably notice).
#
# Runs Importer.apply() directly via `ak shell -c` rather than the `ak apply_blueprint`
# management command: that command calls Importer.validate() (a full dry-run apply inside
# a rolled-back transaction) and then apply() (the same work for real), roughly doubling
# runtime for no benefit here - apply() already rolls back cleanly via its own atomic()
# block on any error, and its return value is checked below to fail the Job (and so the
# ArgoCD sync) on a bad model/!Find/!KeyOf, instead of silently exiting 0 the way
# `ak apply_blueprint` does (it discards apply()'s return value).
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-blueprint-apply
  namespace: {{ include "lib.namespace" . }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: authentik
      containers:
        - name: apply-blueprint
          image: ghcr.io/goauthentik/server:{{ .Subcharts.authentik.Chart.AppVersion }}
          imagePullPolicy: IfNotPresent
          command:
            - ak
            - shell
            - -c
            - |
              import sys
              from authentik.blueprints.models import BlueprintInstance
              from authentik.blueprints.v1.importer import Importer
              from authentik.tenants.models import Tenant

              path = "mounted/cm-authentik-blueprints/access.yaml"
              ok = True
              for tenant in Tenant.objects.filter(ready=True):
                  with tenant:
                      if not Importer.from_string(BlueprintInstance(path=path).retrieve()).apply():
                          ok = False
              sys.exit(0 if ok else 1)
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}
            - secretRef:
                name: authentik-secrets
          volumeMounts:
            - name: blueprints-cm-authentik-blueprints
              mountPath: /blueprints/mounted/cm-authentik-blueprints
      volumes:
        - name: blueprints-cm-authentik-blueprints
          configMap:
            name: authentik-blueprints
