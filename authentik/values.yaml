namespace: authentik

app:
  name: authentik
  domainPrefix: auth
  port: 80

# Upstream chart names its server Service <release>-server, not <app.name>.
service:
  name: authentik-server
  port: 80

ingress:
  enabled: true
  external: true
  # Authentik's own host must not be forward-auth'd against itself, on either class.
  auth: false
  # This host serves the login flow and all its assets for every gated app, so a low
  # rps cap would break page loads.
  rateLimit: false

# Whose accounts appear in the LDAP directory (native Jellyfin clients), and who may
# complete Jellyfin's browser OIDC login (see blueprint-access.yaml's
# provider-jellyfin-oidc). Same group gates both paths to the same app.
ldapGroup: homelab-users

# Source of truth for group membership. The blueprint seeds each user once (state:
# created - passwords/MFA stay in the UI) and sets every group's member list from this
# map on each apply, so membership edits made in the UI are reverted. Groups are
# created from the names used here, in gatedApps, ldapGroup and argocdOidc.
users:
  glazrtom:
    name: Tomáš Glázr
    groups: [homelab-admins, homelab-users]

# Every service Authentik gates, and who is allowed to reach it: `groups` (audiences,
# e.g. homelab-users) and/or `users` (usernames from the map above, for a single
# person's app). At least one is required; a match on any binding grants access. Each
# entry becomes a pair of forward_single providers - one for the public host, one for
# the internal one - each with its own application, both bound identically. Both
# halves come from one entry, so the rules can't drift apart. The public half attaches
# to the embedded outpost, the internal half to the "internal" outpost, so both
# nginx-internal and nginx-external are gated by default.
#
# Each app's access is one generated expression policy, so adding or removing a group
# or user here takes effect on the next blueprint apply with nothing left behind.
#
# There is deliberately no catch-all provider. A host missing from this list, or
# renamed without updating it, matches nothing and the outpost denies it. Hosts that
# must not be gated at all (calibre, authentik itself) opt out explicitly with
# ingress.auth: false.
gatedApps:
  - slug: jellyfin
    name: Jellyfin
    prefix: jellyfin
    groups: [homelab-users]
    # TODO I don't think this is right. Check it
    # Native TV/mobile clients can't follow a browser SSO redirect; exclude their own
    # auth/API endpoints from the forward-auth check rather than leaving the whole
    # host open. Starting point only - widen from the outpost's request log against a
    # real client.
#    skipPathRegex: |
#      ^/(socket|System/Info/Public|Users/AuthenticateByName|QuickConnect)
  - slug: longhorn
    name: Longhorn
    prefix: longhorn
    groups: [homelab-admins]
  - slug: argocd
    name: ArgoCD
    prefix: argo
    groups: [homelab-admins]
  - slug: pihole
    name: Pi-hole
    prefix: pihole
    groups: [homelab-admins]
  - slug: transmission
    name: Transmission
    prefix: transmission
    groups: [homelab-admins]
  - slug: prowlarr
    name: Prowlarr
    prefix: prowlarr
    groups: [homelab-admins]
  - slug: radarr
    name: Radarr
    prefix: radarr
    users: [glazrtom]
  - slug: sonarr
    name: Sonarr
    prefix: sonarr
    users: [glazrtom]
  - slug: gatus
    name: Status
    prefix: status
    groups: [homelab-admins]
  - slug: grafana
    name: Grafana
    prefix: grafana
    groups: [homelab-admins]
  - slug: excalidash
    name: ExcaliDash
    prefix: excalidash
    groups: [homelab-users]

# Browser SSO into ArgoCD itself, layered on top of its forward-auth gate above (the
# `argocd` gatedApps entry). Public client (no client_secret, PKCE instead) so the
# client_id below isn't sensitive - no sealed secret needed. Public issuer only:
# ArgoCD's argocd-cm takes a single oidc.config, so a LAN-only session isn't possible
# the way it is for the proxy providers.
argocdOidc:
  enabled: true
  clientId: argocd
  slug: argocd-oidc
  group: homelab-admins

# Browser SSO into ExcaliDash, on top of its forward-auth gate (the `excalidash`
# gatedApps entry). Public client (PKCE, no client_secret), public issuer only - same
# shape as argocdOidc. The issuer URL the app is given is
# https://auth.<public suffix>/application/o/<slug>/.
excalidashOidc:
  enabled: true
  clientId: excalidash
  slug: excalidash-oidc
  group: homelab-users

authentik:
  global:
    # Appended after the chart's own config secret, so these keys win.
    envFrom:
      - secretRef:
          name: authentik-secrets
    # Falls back to server/worker (and the embedded outpost, which runs inside the
    # server pod). Every host is forward-auth'd through this chart, so it must outlast
    # regular workloads under node pressure.
    priorityClassName: homelab-authentik

  authentik:
    error_reporting:
      enabled: false

  server:
    resources:
      requests:
        cpu: 50m
        memory: 600Mi

  worker:
    resources:
      requests:
        cpu: 100m
        memory: 320Mi

  # Mounted into the worker at /blueprints/mounted/cm-<name>, discovered hourly and
  # on worker start.
  blueprints:
    configMaps:
      - authentik-blueprints

  postgresql:
    enabled: true
    auth:
      username: authentik
      database: authentik
      existingSecret: authentik-secrets
      secretKeys:
        userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
        adminPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
    primary:
      # The Bitnami subchart doesn't read the upstream authentik.global value above.
      priorityClassName: homelab-authentik
      persistence:
        enabled: true
        storageClass: longhorn
        size: 2Gi
      resources:
        requests:
          cpu: 50m
          memory: 200Mi
