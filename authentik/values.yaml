namespace: authentik

app:
  name: authentik
  domainPrefix: auth
  port: 80

# Upstream chart names its server Service <release>-server, not <app.name>.
service:
  name: authentik-server
  port: 80

ingress:
  enabled: true
  external: true
  annotations:
    # Authentik's own host must not be forward-auth'd against itself. Harmless on
    # the nginx-internal copy, which has no global auth.
    nginx.ingress.kubernetes.io/enable-global-auth: "false"

# Whose accounts appear in the LDAP directory, and can therefore log into Jellyfin.
ldapGroup: homelab-users

# Every service Authentik gates, and the group allowed to reach it. Each entry becomes
# a pair of forward_single providers - one for the public host, one for the internal
# one - each with its own application, both bound to the same group. Both halves come
# from one entry, so the rules can't drift apart.
#
# Internal-only services are listed too. The internal half is not wired up yet -
# nginx-internal does no auth today - so their providers see no traffic; they exist so
# that turning it on later is an ingress change rather than a policy decision taken a
# second time.
#
# There is deliberately no catch-all provider. A host missing from this list, or
# renamed without updating it, matches nothing and the outpost denies it. Hosts that
# must not be gated at all (plex, authentik itself) opt out explicitly with
# nginx.ingress.kubernetes.io/enable-global-auth: "false".
gatedApps:
  - slug: jellyfin
    name: Jellyfin
    prefix: jellyfin
    group: homelab-users
    # Native TV and mobile clients cannot follow the SSO redirect, so only the web UI is
    # gated and the API is left to Jellyfin's own LDAP-backed login. RE2 has no lookahead,
    # so "path does not start with /web" is spelled out.
    skipPathRegex: |
      ^/(?:[^w]|w(?:$|[^e]|e(?:$|[^b])))
  - slug: longhorn
    name: Longhorn
    prefix: longhorn
    group: homelab-admins
  - slug: argocd
    name: ArgoCD
    prefix: argo
    group: homelab-admins
  - slug: pihole
    name: Pi-hole
    prefix: pihole
    group: homelab-admins
  - slug: transmission
    name: Transmission
    prefix: transmission
    group: homelab-admins
  - slug: prowlarr
    name: Prowlarr
    prefix: prowlarr
    group: homelab-admins
  - slug: radarr
    name: Radarr
    prefix: radarr
    group: homelab-personal
  - slug: sonarr
    name: Sonarr
    prefix: sonarr
    group: homelab-personal

authentik:
  global:
    # Appended after the chart's own config secret, so these keys win.
    envFrom:
      - secretRef:
          name: authentik-secrets
      - secretRef:
          name: authentik-bootstrap

  authentik:
    error_reporting:
      enabled: false

  # Mounted into the worker at /blueprints/mounted/cm-<name>, discovered hourly and
  # on worker start.
  blueprints:
    configMaps:
      - authentik-blueprints

  postgresql:
    enabled: true
    auth:
      username: authentik
      database: authentik
      existingSecret: authentik-secrets
      secretKeys:
        userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
        adminPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
    primary:
      persistence:
        enabled: true
        storageClass: longhorn
        size: 2Gi
