namespace: authentik

app:
  name: authentik
  domainPrefix: auth
  port: 80

# Upstream chart names its server Service <release>-server, not <app.name>.
service:
  name: authentik-server
  port: 80

ingress:
  enabled: true
  external: true
  # Authentik's own host must not be forward-auth'd against itself, on either class.
  auth: false
  # This host serves the login flow and all its assets for every gated app, so a low
  # rps cap would break page loads.
  rateLimit: false

# Whose accounts appear in the LDAP directory, and can therefore log into Jellyfin.
ldapGroup: homelab-users

# Every service Authentik gates, and the group allowed to reach it. Each entry becomes
# a pair of forward_single providers - one for the public host, one for the internal
# one - each with its own application, both bound to the same group. Both halves come
# from one entry, so the rules can't drift apart. The public half attaches to the
# embedded outpost, the internal half to the "internal" outpost, so both nginx-internal
# and nginx-external are gated by default.
#
# There is deliberately no catch-all provider. A host missing from this list, or
# renamed without updating it, matches nothing and the outpost denies it. Hosts that
# must not be gated at all (plex, calibre, authentik itself) opt out explicitly with
# ingress.auth: false.
gatedApps:
  - slug: jellyfin
    name: Jellyfin
    prefix: jellyfin
    group: homelab-users
    # TODO I don't think this is right. Check it
    # Native TV/mobile clients can't follow a browser SSO redirect; exclude their own
    # auth/API endpoints from the forward-auth check rather than leaving the whole
    # host open. Starting point only - widen from the outpost's request log against a
    # real client.
#    skipPathRegex: |
#      ^/(socket|System/Info/Public|Users/AuthenticateByName|QuickConnect)
  - slug: longhorn
    name: Longhorn
    prefix: longhorn
    group: homelab-admins
  - slug: argocd
    name: ArgoCD
    prefix: argo
    group: homelab-admins
  - slug: pihole
    name: Pi-hole
    prefix: pihole
    group: homelab-admins
  - slug: transmission
    name: Transmission
    prefix: transmission
    group: homelab-admins
  - slug: prowlarr
    name: Prowlarr
    prefix: prowlarr
    group: homelab-admins
  - slug: radarr
    name: Radarr
    prefix: radarr
    group: homelab-personal
  - slug: sonarr
    name: Sonarr
    prefix: sonarr
    group: homelab-personal

authentik:
  global:
    # Appended after the chart's own config secret, so these keys win.
    envFrom:
      - secretRef:
          name: authentik-secrets
      - secretRef:
          name: authentik-bootstrap

  authentik:
    error_reporting:
      enabled: false

  # Mounted into the worker at /blueprints/mounted/cm-<name>, discovered hourly and
  # on worker start.
  blueprints:
    configMaps:
      - authentik-blueprints

  postgresql:
    enabled: true
    auth:
      username: authentik
      database: authentik
      existingSecret: authentik-secrets
      secretKeys:
        userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
        adminPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
    primary:
      persistence:
        enabled: true
        storageClass: longhorn
        size: 2Gi
