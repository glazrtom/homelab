namespace: authentik

app:
  name: authentik
  domainPrefix: auth
  port: 80

# Upstream chart names its server Service <release>-server, not <app.name>.
service:
  name: authentik-server
  port: 80

ingress:
  enabled: true
  external: true

authentik:
  global:
    # Appended after the chart's own config secret, so these keys win.
    envFrom:
      - secretRef:
          name: authentik-secrets

  authentik:
    error_reporting:
      enabled: false

  blueprints:
    configMaps:
      - authentik-blueprints

  postgresql:
    enabled: true
    auth:
      username: authentik
      database: authentik
      existingSecret: authentik-secrets
      secretKeys:
        userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
        adminPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
    primary:
      persistence:
        enabled: true
        storageClass: longhorn
        size: 2Gi
