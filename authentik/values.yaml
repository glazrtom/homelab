namespace: authentik

app:
  name: authentik
  domainPrefix: auth
  port: 80

# Upstream chart names its server Service <release>-server, not <app.name>.
service:
  name: authentik-server
  port: 80

ingress:
  enabled: true
  external: true
  annotations:
    # Authentik's own host must not be forward-auth'd against itself. Harmless on
    # the nginx-internal copy, which has no global auth.
    nginx.ingress.kubernetes.io/enable-global-auth: "false"

# Hosts that gate on homelab-admins rather than the catch-all forward auth. Each one
# also needs ingress.authProvider: <slug>-forward-auth on its own chart, or nothing
# points at the provider declared here.
restrictedApps:
  - slug: longhorn
    name: Longhorn
    prefix: longhorn
  - slug: argocd
    name: ArgoCD
    # Legacy domain predating global.domain.public.suffix, hardcoded the same way in
    # argocd/argocd-ingress-external.yaml. Moving both to the public suffix is its
    # own change; getting it wrong here loses external access to ArgoCD.
    host: argo.glazrtom.fun

authentik:
  global:
    # Appended after the chart's own config secret, so these keys win.
    envFrom:
      - secretRef:
          name: authentik-secrets

  authentik:
    error_reporting:
      enabled: false

  # Mounted into the worker at /blueprints/mounted/cm-<name>, discovered hourly and
  # on worker start.
  blueprints:
    configMaps:
      - authentik-blueprints

  postgresql:
    enabled: true
    auth:
      username: authentik
      database: authentik
      existingSecret: authentik-secrets
      secretKeys:
        userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
        adminPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
    primary:
      persistence:
        enabled: true
        storageClass: longhorn
        size: 2Gi
