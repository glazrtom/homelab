# Values under `metallb:` are passed through to the upstream metallb
# dependency chart; the defaults (speaker + controller, no extra config) are
# fine for this homelab - the speaker runs as a DaemonSet on every node, so L2
# advertisement keeps working regardless of which node a service's pod lands on.
metallb: {}

ipAddressPool:
  name: default-address-pool
  addresses:
    - "10.0.0.150-10.0.0.200"

l2Advertisement:
  name: default-l2-advertisement
