- name: Install ArgoCD
  ansible.builtin.command:
    cmd: kubectl apply -k "{{ argocd_install_kustomize_url }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

- name: Wait until the ArgoCD server is available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ argocd_namespace }}"
    name: argocd-server
    kubeconfig: "{{ kubeconfig_path }}"
  register: argocd_server
  until: >-
    argocd_server.resources | length > 0 and
    (argocd_server.resources[0].status.availableReplicas | default(0)) > 0
  retries: 30
  delay: 10
