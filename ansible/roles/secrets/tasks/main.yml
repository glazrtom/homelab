- name: Verify kubectl and kubeseal are available
  ansible.builtin.command: "command -v {{ item }}"
  register: secrets_tool_check
  changed_when: false
  loop:
    - kubectl
    - kubeseal
  loop_control:
    label: "{{ item }}"

- name: Prompt whether to regenerate sealed secrets
  ansible.builtin.pause:
    prompt: "Regenerate sealed secrets before deploying? (y/N)"
  register: secrets_regenerate_prompt

- name: Reseal application secrets
  when: (secrets_regenerate_prompt.user_input | default('') | lower) in ['y', 'yes']
  block:
    - name: Check which secrets already have local plaintext
      ansible.builtin.stat:
        path: "{{ path_repo_root }}/{{ item.plaintext }}"
      register: secrets_plaintext_stat
      loop: "{{ secrets_items }}"
      loop_control:
        label: "{{ item.script }}"

    - name: Reset prompt state for this run
      ansible.builtin.set_fact:
        secrets_env: {}
        secrets_skipped: []

    - name: Prompt for secrets that need input and have no local plaintext
      ansible.builtin.include_tasks: prompt.yml
      loop: "{{ secrets_items }}"
      loop_control:
        loop_var: secret_item
        label: "{{ secret_item.script }}"
      when:
        - secret_item.prompts is defined
        - not (secrets_plaintext_stat.results | selectattr('item.script', 'equalto', secret_item.script) | map(attribute='stat.exists') | first)

    - name: Warn about scripts skipped due to missing values
      ansible.builtin.debug:
        msg: >-
          Skipped (no value entered, no local plaintext): {{ secrets_skipped | join(', ') }}.
          Committed sealed file(s) left as-is; they may not decrypt if this is a new cluster.
      when: secrets_skipped | length > 0

    - name: Run the secret-generating scripts
      ansible.builtin.command:
        cmd: "./{{ item.script | basename }}"
        chdir: "{{ path_repo_root }}/{{ item.script | dirname }}"
      environment: "{{ {'KUBECONFIG': kubeconfig_path} | combine(secrets_env[item.script] | default({})) }}"
      changed_when: false
      no_log: true
      loop: "{{ secrets_items }}"
      loop_control:
        label: "{{ item.script }}"
      when: item.script not in secrets_skipped

    - name: Check whether any sealed secret changed
      ansible.builtin.command:
        cmd: "git status --porcelain -- {{ secrets_items | map(attribute='sealed') | join(' ') }}"
        chdir: "{{ path_repo_root }}"
      changed_when: false
      register: secrets_git_status

    - name: Collect the sealed secrets that changed
      ansible.builtin.set_fact:
        secrets_changed: "{{ secrets_git_status.stdout_lines | map('regex_replace', '^.{3}', '') | list }}"

    - name: Commit and push changed sealed secrets
      when: secrets_changed | length > 0
      block:
        - name: Stage the sealed secrets
          ansible.builtin.command:
            cmd: "git add -- {{ secrets_changed | join(' ') }}"
            chdir: "{{ path_repo_root }}"

        - name: Commit the sealed secrets
          ansible.builtin.command:
            cmd: "git commit -m \"{{ secrets_commit_message }}\" -- {{ secrets_changed | join(' ') }}"
            chdir: "{{ path_repo_root }}"

        - name: Push the commit
          ansible.builtin.command:
            cmd: git push
            chdir: "{{ path_repo_root }}"
