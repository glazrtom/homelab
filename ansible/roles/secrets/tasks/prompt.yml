# Included once per secrets_items entry that has `prompts` and no local plaintext yet.
# Loop variable: secret_item (set by the caller in main.yml).
- name: "Reset prompt collection for {{ secret_item.script }}"
  ansible.builtin.set_fact:
    secrets_item_env: {}
    secrets_item_blank: false

- name: "Prompt for {{ secret_item.script }} values"
  ansible.builtin.pause:
    prompt: "{{ item.prompt }} (leave blank to skip {{ secret_item.script }})"
    echo: "{{ item.echo }}"
  register: secrets_prompt_result
  no_log: true
  loop: "{{ secret_item.prompts }}"
  loop_control:
    label: "{{ item.var }}"

- name: "Collect prompt values for {{ secret_item.script }}"
  ansible.builtin.set_fact:
    secrets_item_env: "{{ secrets_item_env | combine({result.item.var: (result.user_input | default(''))}) }}"
    secrets_item_blank: "{{ secrets_item_blank or (result.user_input | default('') | length == 0) }}"
  no_log: true
  loop: "{{ secrets_prompt_result.results }}"
  loop_control:
    loop_var: result
    label: "{{ result.item.var }}"

- name: "Record collected values or mark {{ secret_item.script }} as skipped"
  ansible.builtin.set_fact:
    secrets_env: "{{ secrets_item_blank | bool | ternary(secrets_env, secrets_env | combine({secret_item.script: secrets_item_env})) }}"
    secrets_skipped: "{{ secrets_item_blank | bool | ternary(secrets_skipped + [secret_item.script], secrets_skipped) }}"
