# Runs after argocd_apps has applied the app-of-apps, regardless of whether secrets
# were regenerated this run, so a sealed secret left over from a different cluster's
# key is caught rather than silently failing to decrypt.
- name: Wait for expected secrets to appear in the cluster
  kubernetes.core.k8s_info:
    kind: Secret
    name: "{{ item.name }}"
    namespace: "{{ item.namespace }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: secrets_verify_result
  until: secrets_verify_result.resources | length > 0
  retries: "{{ secrets_verify_retries }}"
  delay: "{{ secrets_verify_delay }}"
  failed_when: false
  loop: "{{ secrets_items | map(attribute='verify') | unique | list }}"
  loop_control:
    label: "{{ item.name }} ({{ item.namespace }})"

- name: Warn about secrets that never decrypted
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }} not found in namespace {{ item.item.namespace }} after
      {{ secrets_verify_retries }} retries. It is likely still sealed against a
      different cluster's key — remove its local plaintext and re-run
      playbooks/secrets.yml.
  when: item.resources | default([]) | length == 0
  loop: "{{ secrets_verify_result.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Check whether the Windscribe secret was mirrored into media by reflector
  kubernetes.core.k8s_info:
    kind: Secret
    name: windscribe-auth
    namespace: media
    kubeconfig: "{{ kubeconfig_path }}"
  register: secrets_verify_reflector
  until: secrets_verify_reflector.resources | length > 0
  retries: "{{ secrets_verify_retries }}"
  delay: "{{ secrets_verify_delay }}"
  failed_when: false

- name: Warn if the Windscribe secret was not mirrored into media
  ansible.builtin.debug:
    msg: >-
      windscribe-auth not found in namespace media after {{ secrets_verify_retries }}
      retries. Check that the media namespace exists and reflector is running.
  when: secrets_verify_reflector.resources | default([]) | length == 0
