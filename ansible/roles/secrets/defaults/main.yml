secrets_commit_message: "Regenerate sealed secrets"

sealed_secrets_namespace: kube-system
sealed_secrets_fullname: sealed-secrets-controller

# Each item's generate-secret.sh is idempotent: it reuses the existing gitignored
# plaintext when present, and only builds fresh values (random, or from `prompts`)
# when it is missing. Resealing (via scripts/seal.sh) is itself skipped unless the
# plaintext hash changed or the committed sealed file no longer validates against
# the live controller, since kubeseal's output is non-deterministic run to run.
secrets_items:
  - script: authentik/generate-secret.sh
    sealed: authentik/templates/sealed-secret.yaml
    plaintext: authentik/secrets/secret.yaml
    prompts:
      - { var: AUTHENTIK_BOOTSTRAP_EMAIL, prompt: "Authentik admin (akadmin) email", echo: true }

  - script: base/generate-secret.sh
    sealed: base/github-credentials-sealed.yaml
    plaintext: base/secrets/github-credentials.yaml
    prompts:
      - { var: GHCR_USERNAME, prompt: "GitHub username", echo: true }
      - { var: GHCR_TOKEN, prompt: "GitHub PAT", echo: false }
      - { var: GHCR_EMAIL, prompt: "GitHub email", echo: true }

  - script: base/generate-windscribe-secret.sh
    sealed: base/windscribe-sealed.yaml
    plaintext: base/secrets/windscribe.yaml
    prompts:
      - { var: WINDSCRIBE_USERNAME, prompt: "Windscribe username", echo: true }
      - { var: WINDSCRIBE_PASSWORD, prompt: "Windscribe password", echo: false }

  - script: rallly/generate-secret.sh
    sealed: rallly/templates/sealed-secret.yaml
    plaintext: rallly/secrets/secret.yaml
    prompts:
      - { var: RALLLY_SMTP_PWD, prompt: "Rallly SMTP password", echo: false }

  - script: longhorn/generate-b2-secret.sh
    sealed: longhorn/templates/sealed-b2.yaml
    plaintext: longhorn/secrets/b2.yaml
    prompts:
      - { var: B2_KEY_ID, prompt: "Backblaze B2 keyID", echo: true }
      - { var: B2_APP_KEY, prompt: "Backblaze B2 applicationKey", echo: false }
      - { var: B2_ENDPOINT, prompt: "Backblaze B2 S3 endpoint URL", echo: true }
