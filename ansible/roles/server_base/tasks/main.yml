- name: Set hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"

- name: Ensure the server group exists
  become: true
  ansible.builtin.group:
    name: "{{ server_group }}"
    gid: "{{ server_gid }}"
    state: present

- name: Create the server service account
  become: true
  ansible.builtin.user:
    name: "{{ server_user }}"
    uid: "{{ server_uid }}"
    group: "{{ server_group }}"
    create_home: no
    shell: /sbin/nologin
    state: present

- name: Add the login user to the server group
  become: true
  ansible.builtin.user:
    name: "{{ server_admin_user }}"
    groups: "{{ server_group }}"
    append: true

# Needed on every node for the VPN sidecars (transmission-openvpn, prowlarr's gluetun) -
# whichever node they land on must have tun available.
- name: Persist the tun kernel module across reboots
  become: true
  ansible.builtin.copy:
    dest: /etc/modules-load.d/tun.conf
    content: "tun\n"
    mode: "0644"

- name: Load the tun kernel module now
  become: true
  community.general.modprobe:
    name: tun
    state: present
