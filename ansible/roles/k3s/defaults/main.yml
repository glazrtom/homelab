k3s_version: v1.37.1+k3s1

k3s_install_exec: "server --disable traefik --disable servicelb --disable local-storage"
k3s_agent_install_exec: "agent"

k3s_server_url: "https://{{ hostvars[groups['server'][0]].ansible_host }}:6443"

# Node labels applied at registration (k3s picks these up from config.yaml's
# node-label list). Empty on the server; set per-host in inventory.ini for agents.
k3s_node_labels: []

# Extra kubelet args, e.g. system-reserved on the control-plane node so the scheduler
# accounts for k3s/ArgoCD's own footprint. Empty by default.
k3s_kubelet_args: []

# Unused images are removed after this long, regardless of disk usage (kubelet
# otherwise only image-GCs once the image filesystem crosses 85% full).
k3s_image_maximum_gc_age: 168h
