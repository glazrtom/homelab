sealed_secrets_namespace: kube-system
sealed_secrets_fullname: sealed-secrets-controller

cloudflare_sealed_secret_rel_path: cloudflare/templates/sealed-token.yaml
cloudflare_sealed_secret_path: "{{ path_repo_root }}/{{ cloudflare_sealed_secret_rel_path }}"

cloudflare_tunnel_name: homelab
cloudflare_cli_config_dir: "{{ path_home }}/.cloudflared"
cloudflare_cli_cert: "{{ cloudflare_cli_config_dir }}/cert.pem"
cloudflare_route_dns: true
cloudflare_route_dns_overwrite: true

cloudflare_domain: >-
  {{ (lookup('file', path_repo_root ~ '/global/values.yaml') | from_yaml).global.domain.public.suffix }}

cloudflare_enforce_https: true
cloudflare_api_token: ""
