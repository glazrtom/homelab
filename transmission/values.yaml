replicaCount: 1
namespace: transmission

app:
  name: transmission
  port: 9091
  domainPrefix: transmission

ingress:
  external: true
  auth: true

image:
  repository: haugene/transmission-openvpn
  pullPolicy: IfNotPresent
  tag: "5.5.2"

extraEnv:
  - name: OPENVPN_PROVIDER
    value: "WINDSCRIBE"
  - name: OPENVPN_CONFIG
    value: "Prague-Vltava-udp"
  - name: TRANSMISSION_WEB_UI
    value: "flood-for-transmission"
  - name: LOCAL_NETWORK
    value: "10.42.0.0/15"

initPerms:
  image:
    repository: busybox
    tag: "1.38"

extraEnvTemplate: transmission.env
sidecarsTemplate: transmission.sidecars

# theopsguy/transmission-exporter: speeds, torrent counts, session totals.
exporter:
  image:
    repository: theopsguy/transmission-exporter
    tag: "0.3.3"
  port: 19091
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 32Mi

# The exporter image is published for amd64 only; this is forced by the image, not a
# scheduling preference.
nodeSelector:
  kubernetes.io/arch: amd64

securityContext:
  capabilities:
    add:
      - NET_ADMIN

resources:
  requests:
    cpu: 200m
    memory: 64Mi

volumes:
  config:
    create: true
    size: 1Gi
    storageClassName: longhorn
    mountPath: /config
  media:
    claimName: transmission-media-pvc
    mountPath: /media

secrets:
  name: windscribe-auth
  usernameKey: username
  passwordKey: password
