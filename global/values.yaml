global:
  user:
    uid: "1001"
    gid: "1001"

  timezone: "Europe/Prague"

  domain:
    internal:
      suffix: "internal"
    public:
      suffix: "glazrtom.cz"

  revisionHistoryLimit: 1

  ingress:
    internal:
      className: nginx-internal
      loadBalancerIP: "10.0.0.150"
    external:
      className: nginx-external

  # The one embedded outpost. Consumed by the nginx-external global-auth-url and by
  # lib.authOutpost* for the per-app auth-url / ExternalName alias.
  authentik:
    namespace: authentik
    outpost:
      service: ak-outpost-authentik-embedded-outpost
      port: 9000

  sharedMedia:
    name: shared-media
    size: 100Gi              # PV/PVC capacity
    sizeBytes: "107374182400" # same value in bytes, for the Longhorn Volume CR

    # Every consumer mounts the volume root here, so a path means the same thing in
    # transmission, the *arr apps and Plex/Jellyfin - no remote path mapping needed.
    mountPath: /media
    dirs:
      - downloads/complete
      - downloads/incomplete
      - movies
      - series
