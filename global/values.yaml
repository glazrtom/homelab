global:
  user:
    uid: "1001"
    gid: "1001"

  timezone: "Europe/Prague"

  domain:
    internal:
      suffix: "internal"
    public:
      suffix: "glazrtom.cz"

  revisionHistoryLimit: 1

  ingress:
    internal:
      className: nginx-internal
      loadBalancerIP: "10.0.0.150"
    external:
      className: nginx-external
      # k3s cluster pod CIDR (kubectl get node -o jsonpath='{.items[0].spec.podCIDR}'
      # widened from the node's /24 to the cluster's configured /16) - used to restrict
      # which hop is trusted to set X-Forwarded-For once enable-real-ip is on.
      trustedProxyCidr: "10.42.0.0/16"

  # Two proxy outposts: the embedded one gates public hosts and must have its
  # authentik_host set to the public host (its browser redirects ignore
  # authentik_host_browser); the internal one is a deployed outpost so it can honour
  # the authentik_host/authentik_host_browser split and keep LAN logins on the LAN.
  # Consumed by the two ingress.internalConfig/externalConfig global-auth-urls and by
  # lib.authOutpost* for the per-app, per-class auth-url / ExternalName alias.
  authentik:
    namespace: authentik
    outposts:
      external:
        service: ak-outpost-authentik-embedded-outpost
        port: 9000
      internal:
        service: ak-outpost-internal
        port: 9000

  sharedMedia:
    name: shared-media
    size: 100Gi              # PV/PVC capacity
    sizeBytes: "107374182400" # same value in bytes, for the Longhorn Volume CR

    # Every consumer mounts the volume root here, so a path means the same thing in
    # transmission, the *arr apps and Plex/Jellyfin - no remote path mapping needed.
    mountPath: /media
    dirs:
      - downloads/complete
      - downloads/incomplete
      - movies
      - series
