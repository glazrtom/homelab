namespace: ntfy

image:
  repository: binwiederhier/ntfy
  tag: "v2.28.0"
  pullPolicy: IfNotPresent

args: ["serve"]

app:
  name: ntfy
  port: 80
  domainPrefix: ntfy

priorityClassName: homelab-monitoring

# The web dashboard is gated by Authentik like any other admin tool - but ntfy's
# mobile/desktop clients speak plain HTTP/WebSocket Basic/Bearer auth and can't follow
# the forward-auth browser redirect, so the API paths are carved out of the gate via
# authentik/values.yaml's ntfy gatedApps entry (skipPathRegex) and keep relying on
# ntfy's own NTFY_AUTH_* (deny-all default, see templates/_env.tpl). webRoot below
# must stay in step with that regex by hand - values aren't shared across charts.
ingress:
  enabled: true
  external: true
  auth: true
  # The skipPathRegex-exempted API paths bypass Authentik, so they need their own
  # limiter - lib.ingress only applies its default when auth is false. Same numbers
  # as that default (lib/templates/_ingress.tpl's lib.rateLimitDefault).
  rateLimit:
    rps: 20
    connections: 20
    burstMultiplier: 5
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

# Moves the web app off "/" so authentik/values.yaml's skipPathRegex can cleanly
# exempt "everything except /ui" instead of enumerating every API/topic path (topics
# are arbitrary strings, so a positive list can't cover them).
webRoot: "/ui"

volumes:
  data:
    create: true
    size: 1Gi
    storageClassName: longhorn
    mountPath: /var/cache/ntfy

extraEnvTemplate: ntfy.env

resources:
  requests: { cpu: 10m, memory: 128Mi }
  limits: { cpu: 100m, memory: 128Mi }

probes:
  readinessProbe:
    httpGet:
      path: /v1/health
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /v1/health
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 30
