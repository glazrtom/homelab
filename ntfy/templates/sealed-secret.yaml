---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ntfy-auth
  namespace: ntfy
spec:
  encryptedData:
    ADMIN_PASSWORD: 
    ADMIN_USER: 
    AM_PASSWORD: 
    AM_TOKEN: 
    MEDIA_PASSWORD: 
    MEDIA_TOKEN: 
    NTFY_AUTH_TOKENS: 
    NTFY_AUTH_USERS: 
  template:
    metadata:
      name: ntfy-auth
      namespace: ntfy
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ntfy-alertmanager-token
  namespace: ntfy
spec:
  encryptedData:
    TOKEN: 
  template:
    metadata:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: monitoring
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: monitoring
      name: ntfy-alertmanager-token
      namespace: ntfy
