---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rallly-postgresql
  namespace: rallly
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: rallly-postgresql
      namespace: rallly
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rallly-garage
  namespace: rallly
spec:
  encryptedData:
    GARAGE_DEFAULT_ACCESS_KEY: 
    GARAGE_DEFAULT_SECRET_KEY: 
    GARAGE_RPC_SECRET: 
  template:
    metadata:
      name: rallly-garage
      namespace: rallly
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rallly
  namespace: rallly
spec:
  encryptedData:
    CRON_SECRET: 
    OIDC_CLIENT_SECRET: 
    SECRET_PASSWORD: 
    SMTP_PWD: 
  template:
    metadata:
      name: rallly
      namespace: rallly
