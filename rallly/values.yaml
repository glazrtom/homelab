# Deployed from the released chart at oci://ghcr.io/glazrtom/charts/rallly (see
# Chart.yaml). The existingSecret* keys below point at the SealedSecrets in
# templates/sealed-secret.yaml, generated/managed by ./generate-secret.sh — the
# chart's own generation relies on Helm `lookup`, which does not work under
# ArgoCD (`helm template`), so it would mint fresh random credentials on every
# render and break the already-initialised Postgres/Garage data.

namespace: rallly

app:
  name: rallly
  domainPrefix: rallly

# The upstream chart's Service (release name == chart name, so just "rallly").
service:
  name: rallly
  port: 80

ingress:
  enabled: true
  external: true
  auth: true
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"

rallly:
  baseUrl: "https://rallly.glazrtom.cz"
  supportEmail: "glazrtom.homelab@gmail.com"
  existingSecret: rallly
  ingress:
    enabled: false
  emailLogin:
    enabled: false
  oidc:
    enabled: true
    name: Authentik
    discoveryUrl: "https://auth.glazrtom.cz/application/o/rallly-oidc/.well-known/openid-configuration"
    clientId: rallly
  postgresql:
    existingSecret: rallly-postgresql
  garage:
    existingSecret: rallly-garage
  smtp:
    host: "smtp.gmail.com"
    port: 587
    secure: false
    user: "glazrtom.homelab@gmail.com"
    rejectUnauthorized: true
  extraEnv:
    - name: SMTP_PWD
      valueFrom:
        secretKeyRef:
          name: smtp-credentials
          key: SMTP_PWD
    # Reflected from authentik (authentik/generate-secret.sh).
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: rallly-oidc-client
          key: OIDC_CLIENT_SECRET
